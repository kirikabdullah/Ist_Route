<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>İst-Route · Mobil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* Kullanıcının mobil tasarım sistemi (tailwind.config.js) */
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter','system-ui','-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','sans-serif'] },
    colors: {
      brand: { DEFAULT: '#C1125A' },
      istanbulkart: { blue: '#0A7EB9', cyan: '#00CCFF' },
      ui: { dark: '#1F2937', muted: '#6B7280', light: '#9CA3AF', bg: '#F3F4F6' },
      route: { red: '#E30613', blue: '#00A3E0', yellow: '#FBB034' }
    },
    fontSize: {
      heading: ['1.25rem', { lineHeight: '1.75rem', fontWeight: '500' }],
      title: ['1rem', { lineHeight: '1.5rem', fontWeight: '500' }],
      body: ['0.875rem', { lineHeight: '1.25rem', fontWeight: '400' }],
      description: ['0.8125rem', { lineHeight: '1.125rem', fontWeight: '400' }],
      caption: ['0.75rem', { lineHeight: '1rem', fontWeight: '500' }]
    }
  } }
};
</script>
<style>
  :root{ --sheet:0px; --tabs:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    --brand:#C1125A; --ikblue:#0A7EB9; --ikcyan:#00CCFF; --dark:#1F2937; --muted:#6B7280; --light:#9CA3AF; --bg:#F3F4F6; }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--dark);font-feature-settings:"tnum" 1}
  button{touch-action:manipulation}
  [hidden]{display:none!important}   /* Tailwind flex/grid sınıfları hidden özelliğini ezmesin */
  :focus-visible{outline:2px solid var(--ikblue);outline-offset:2px}
  ::selection{background:rgba(10,126,185,.2)}
  #map{position:fixed;inset:0;z-index:0;background:#E5E7EB}
  .leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.75)!important;color:var(--muted)!important}
  .leaflet-bottom.leaflet-right{bottom:calc(var(--sheet) + var(--tabs) + var(--safe-b))}
  .leaflet-div-icon{background:none;border:0}
  /* sheet */
  .sheet{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + var(--safe-b));z-index:30;height:var(--sheet);
    background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(31,41,55,.14);display:flex;flex-direction:column;
    transition:height .32s cubic-bezier(.2,.8,.2,1)}
  .sheet.dragging{transition:none}
  .grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
  .grab i{width:40px;height:5px;border-radius:3px;background:#D1D5DB}
  .sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tabs) + var(--safe-b));padding-bottom:var(--safe-b);
    background:#fff;border-top:1px solid #E5E7EB;display:grid;grid-template-columns:repeat(4,1fr)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--light);font-size:11px;font-weight:600}
  .tab[aria-selected="true"]{color:var(--brand)}
  .tab .dot{position:absolute;margin-left:18px;margin-top:-18px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
  /* route option */
  .opt{position:relative;display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1.5px solid #E5E7EB;background:#fff;transition:border-color .2s,box-shadow .2s,background .2s}
  .opt[aria-checked="true"]{border-color:var(--c);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 22%,transparent);background:color-mix(in srgb,var(--c) 5%,#fff)}
  .opt[aria-disabled="true"]{opacity:.5}
  .opt .bar{width:5px;border-radius:3px;background:var(--c);flex:none}
  /* timeline */
  .tl{position:relative;display:flex;gap:12px;padding-bottom:14px}
  .tl:last-child{padding-bottom:0}
  .tl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--c);color:#fff;z-index:1}
  .tl .ic.walk{background:#F3F4F6;color:var(--muted)}
  .tl .ic.mola{background:#FBB034;color:#3a2600}
  .tl::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--lc,#E5E7EB)}
  .tl:last-child::before{display:none}
  .tl.now .ic{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
  .tl.done{opacity:.45}
  /* map visuals */
  .flow{stroke-dasharray:2 16;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .pin{transform-origin:50% 100%}
  .endpt{width:18px;height:18px;border-radius:50%;border:3.5px solid #fff;box-shadow:0 3px 10px rgba(31,41,55,.35)}
  .lbl{position:absolute;left:24px;top:-3px;white-space:nowrap;font:600 12px Inter,sans-serif;padding:2px 7px;border-radius:7px;background:#fff;color:var(--dark);box-shadow:0 2px 8px rgba(31,41,55,.18)}
  .stopmk{position:relative;width:44px;height:44px}
  .stopmk .pl{position:absolute;inset:0;border-radius:50%;background:rgba(251,176,52,.45);animation:pulse 1.8s ease-out infinite}
  .stopmk .core{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 12px rgba(31,41,55,.3)}
  @keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .veh{position:relative;width:38px;height:38px}
  .veh .core{position:absolute;inset:0;border-radius:50%;background:var(--vc);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(31,41,55,.4)}
  .veh .ring{position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--vc);opacity:.5;animation:pulse 1.6s ease-out infinite}
  .chip-map{display:flex;align-items:center;gap:5px;width:max-content;font:600 11px Inter,sans-serif;padding:4px 8px 4px 5px;border-radius:999px;background:#fff;color:var(--dark);border:1.5px solid var(--bc);box-shadow:0 2px 8px rgba(31,41,55,.18)}
  .kid-badge{display:flex;align-items:center;gap:5px;width:max-content;transform:translate(-50%,-50%);padding:2px 9px 2px 2px;border-radius:999px;background:#fff;border:2px solid var(--kc);font:600 11.5px Inter,sans-serif;color:var(--dark);box-shadow:0 2px 8px rgba(31,41,55,.2)}
  .kid-badge span{width:20px;height:20px;border-radius:50%;background:var(--kc);color:#fff;display:grid;place-items:center;font-size:11px}
  .cancel{transform:translate(-50%,-50%);width:max-content;display:flex;align-items:center;gap:5px;font:600 11.5px Inter,sans-serif;padding:5px 9px;border-radius:999px;background:#C00510;color:#fff}
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 12px 30px rgba(31,41,55,.25)}
  .leaflet-popup-content{margin:12px 14px;font:400 13px/1.45 Inter,sans-serif;color:var(--dark)}
  /* switch */
  .sw{position:relative;width:46px;height:28px;border-radius:999px;background:#D1D5DB;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .sw[aria-checked="true"]{background:var(--brand)} .sw[aria-checked="true"]::after{transform:translateX(18px)}
  /* chat */
  .msg{max-width:88%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
  .msg.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:5px}
  .msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
  .msg b{font-weight:600}
  .toast{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 128px);z-index:60;transform:translateY(-12px);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
  .toast.show{transform:none;opacity:1}
  .search{position:fixed;inset:0;z-index:70;background:#fff;display:none;flex-direction:column}
  .search.open{display:flex}
  .scroll-x{scrollbar-width:none}.scroll-x::-webkit-scrollbar{display:none}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body class="font-sans">
<div id="map" role="application" aria-label="Rota haritası"></div>

<!-- Üst: yolculuk kartı -->
<header class="fixed left-3 right-3 z-20" style="top:calc(var(--safe-t) + 10px)">
  <div class="relative bg-white rounded-2xl shadow-[0_8px_24px_rgba(31,41,55,.14)] pl-3 pr-14 py-1.5">
    <button id="fFrom" class="w-full flex items-center gap-3 min-h-[44px] text-left" aria-label="Kalkış noktasını değiştir">
      <span class="w-3 h-3 rounded-full bg-ui-dark ring-4 ring-ui-bg flex-none"></span>
      <span class="min-w-0"><span class="block text-caption text-ui-muted">Nereden</span><span id="fromTxt" class="block text-title truncate"></span></span>
    </button>
    <div class="ml-6 border-t border-gray-100"></div>
    <button id="fTo" class="w-full flex items-center gap-3 min-h-[44px] text-left" aria-label="Varış noktasını değiştir">
      <span class="w-3 h-3 rounded-full bg-brand ring-4 ring-pink-50 flex-none"></span>
      <span class="min-w-0"><span class="block text-caption text-ui-muted">Nereye</span><span id="toTxt" class="block text-title truncate"></span></span>
    </button>
    <button id="btnSwap" class="absolute right-2 top-1/2 -translate-y-1/2 w-11 h-11 rounded-xl bg-ui-bg grid place-items-center text-ui-dark" aria-label="Kalkış ve varışı yer değiştir"></button>
  </div>
  <div class="flex gap-2 mt-2 scroll-x overflow-x-auto">
    <button id="chipTime" class="flex-none h-9 px-3 rounded-full bg-white shadow-[0_4px_14px_rgba(31,41,55,.12)] text-caption flex items-center gap-1.5"></button>
    <button id="chipWx" class="flex-none h-9 px-3 rounded-full bg-white shadow-[0_4px_14px_rgba(31,41,55,.12)] text-caption flex items-center gap-1.5"></button>
  </div>
</header>

<!-- Harita düğmesi -->
<button id="btnFit" class="fixed right-3 z-20 w-11 h-11 rounded-full bg-white shadow-[0_6px_18px_rgba(31,41,55,.18)] grid place-items-center text-ui-dark" style="bottom:calc(var(--sheet) + var(--tabs) + var(--safe-b) + 12px)" aria-label="Rotaya odaklan"></button>

<!-- Alt sayfa -->
<section id="sheet" class="sheet" aria-label="Rota ayrıntıları">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Paneli büyüt veya küçült"><i></i></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<nav class="tabs" role="tablist" aria-label="Bölümler">
  <button class="tab" role="tab" data-tab="rota" aria-selected="true"><span data-ic="metro"></span>Rotalar</button>
  <button class="tab" role="tab" data-tab="ai" aria-selected="false"><span data-ic="spark"></span>Asistan</button>
  <button class="tab relative" role="tab" data-tab="cuzdan" aria-selected="false"><span data-ic="card"></span>Cüzdan<span class="dot" id="walletDot" hidden></span></button>
  <button class="tab" role="tab" data-tab="ayar" aria-selected="false"><span data-ic="sliders"></span>Ayarlar</button>
</nav>

<!-- Arama ekranı -->
<div class="search" id="search" role="dialog" aria-label="Yer ara">
  <div class="flex items-center gap-2 px-3 pb-2 border-b border-gray-100" style="padding-top:calc(var(--safe-t) + 10px)">
    <button id="sBack" class="w-11 h-11 grid place-items-center rounded-xl text-ui-dark" aria-label="Geri"></button>
    <input id="sIn" class="flex-1 h-11 px-3 rounded-xl bg-ui-bg text-title outline-none focus:ring-2 focus:ring-istanbulkart-blue" type="search" autocomplete="off" spellcheck="false" aria-label="Durak, iskele veya yer ara">
  </div>
  <button id="sGps" class="flex items-center gap-3 px-4 min-h-[56px] text-left border-b border-gray-100" hidden>
    <span class="w-9 h-9 rounded-full bg-istanbulkart-blue/10 text-istanbulkart-blue grid place-items-center" data-ic="target"></span>
    <span><span class="block text-title">Mevcut konumum</span><span class="block text-description text-ui-muted">En yakın durağa bağlanır</span></span>
  </button>
  <div id="sList" class="flex-1 overflow-y-auto" role="listbox" aria-label="Sonuçlar"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><div class="bg-ui-dark text-white text-body rounded-2xl px-4 py-3 shadow-xl" id="toastIn"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const D = /*__IST_PAYLOAD__*/null;
(function(){
if(!D || !window.L){ document.body.insertAdjacentHTML("beforeend",'<div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#fff;z-index:99"><p>İst-Route yüklenemedi. İnternet bağlantısını kontrol edin.</p></div>'); return; }

/*__ENGINE__*/
/*__ASSISTANT__*/

/* ================= mobil ek simgeler ================= */
Object.assign(ICO, {
  card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  back:'<path d="m15 18-6-6 6-6"/>', stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>'
});
document.querySelectorAll("[data-ic]").forEach(el => el.innerHTML = svg(el.dataset.ic, 22, 2));
$("btnSwap").innerHTML = svg("swap", 20, 2.2);
$("btnFit").innerHTML = svg("target", 20, 2.2);
$("sBack").innerHTML = svg("back", 22, 2.4);

/* ================= mobil durum ================= */
const M = {tab:"rota", snap:"half", timeOpen:false, searchFor:null, profOpen:false};
state.kat = {lokanta:true, spor:false, muze:false, kopru:true, rail:false};
// Tam modda panel arama kartının hemen altında durur (kalkış/varış her zaman görünür)
const SNAP = () => {
  const tabs = $("sheet").getBoundingClientRect().bottom || innerHeight - 64;
  const top = document.querySelector("header > div").getBoundingClientRect().bottom + 8;
  return {peek:176, half:Math.round(innerHeight * .46), full:Math.max(300, Math.round(tabs - top))};
};
const ROUTE_COL = {kirmizi:"#E30613", mavi:"#00A3E0", sari:"#FBB034"};
const RNAME = {kirmizi:"Kırmızı", mavi:"Mavi", sari:"Sarı"};
const toast = html => { $("toastIn").innerHTML = html; $("toast").classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => $("toast").classList.remove("show"), 3000); };
const announce = toast;
const legTarget = l => { const m = /→\s*([^(]+)/.exec(l.ad || ""); return m ? m[1].trim() : ""; };
const iskele = l => { const t = (legTarget(l) || "").replace(/\s*İskelesi$/i, ""); return t ? `${t} iskelesine` : "iskeleye"; };
const iskeleDe = l => { const t = (legTarget(l) || "").replace(/\s*İskelesi$/i, ""); return t ? `${t} iskelesinde` : "iskelede"; };

/* ================= harita ================= */
const map = L.map("map", {zoomControl:false, attributionControl:true, zoomSnap:.25, tap:true}).setView([41.02, 29.0], 12);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {maxZoom:16, maxNativeZoom:16,
  attribution:"&copy; Esri · İBB GTFS & Açık Veri · ücret/senaryo: simülasyon"}).addTo(map);
map.createPane("labels"); map.getPane("labels").style.zIndex = 390; map.getPane("labels").style.pointerEvents = "none";
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {maxZoom:16, maxNativeZoom:16, pane:"labels"}).addTo(map);
const G = {rail:L.layerGroup().addTo(map), alt:L.layerGroup().addTo(map), kids:L.layerGroup().addTo(map), route:L.layerGroup().addTo(map),
  pts:L.layerGroup().addTo(map), pois:L.layerGroup().addTo(map), sim:L.layerGroup().addTo(map)};
const routePts = r => { const a = []; r.legs.forEach(l => l.g && D.geoms[l.g] && a.push(...D.geoms[l.g])); return a; };
const div = (html, size, anchor) => L.divIcon({className:"", html, iconSize:size, iconAnchor:anchor});

function poiIcon(p){
  const k = KAT[p.kat], g = p.kat === "lokanta" ? "fork" : p.kat === "spor" ? "dumbbell" : "museum";
  if(p.kat === "muze") return div(`<div style="width:22px;height:22px;border-radius:50%;background:${k.renk};border:2px solid #fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)">${svg(g,11,2.4,"#fff")}</div>`, [22,22], [11,11]);
  return div(`<div class="pin" style="position:relative;width:26px;height:33px"><svg width="26" height="33" viewBox="0 0 32 40"><path d="M16 39c-1.2-5-12-12.6-12-23.2A12 12 0 0 1 28 15.8C28 26.4 17.2 34 16 39z" fill="${k.renk}" stroke="#fff" stroke-width="2.4"/></svg><div style="position:absolute;left:6px;top:5px">${svg(g,14,2.4,"#fff")}</div></div>`, [26,33], [13,32]);
}
function poiPopup(p){
  return `<div style="font-weight:600;font-size:14px;margin-bottom:2px">${esc(p.isim)}</div><div style="color:#6B7280">${esc(KAT[p.kat].kisa)} · ${esc(p.ilce)}</div>
    <div style="margin-top:6px">${esc(p.saat_metin)} · ${esc(p.gunler)}</div><div style="margin-top:4px;color:#C1125A;font-weight:600">+${p.odul_puani} İBB Puanı</div>`;
}
function drawMap(fit){
  const s = step(), act = aktifRota();
  map.closePopup();
  Object.entries(G).forEach(([k, g]) => { if(k !== "sim") g.clearLayers(); });
  if(state.kat.rail && D.rail) D.rail.hatlar.forEach(h => { const ok = !/inşaat/i.test(h.asama || "");
    h.parcalar.forEach(p => L.polyline(p, {color:"#4B5563", weight:2, opacity:ok ? .45 : .25, dashArray:ok ? null : "4 6", interactive:false}).addTo(G.rail)); });
  if(!act) return;
  s.rotalar.filter(r => r.id !== act.id && !r.iptal).forEach(r => r.legs.forEach(l => { const g = l.g && D.geoms[l.g]; if(!g) return;
    L.polyline(g, {color:ROUTE_COL[r.renk], weight:5, opacity:.3, dashArray:l.mod === "yurume" ? "1 8" : null}).on("click", () => selectRoute(r.id)).addTo(G.alt); }));
  const c = ROUTE_COL[act.renk];
  act.legs.forEach(l => { const g = l.g && D.geoms[l.g]; if(!g) return;
    const walk = l.mod === "yurume", sea = l.mod === "vapur";
    L.polyline(g, {color:"#fff", weight:walk ? 8 : 11, opacity:.95, interactive:false}).addTo(G.route);
    L.polyline(g, {color:c, weight:walk ? 4.5 : 6.5, lineCap:sea ? "butt" : "round", dashArray:walk ? "0.1 9" : sea ? "12 8" : null, interactive:false}).addTo(G.route);
    if(!walk && !sea) L.polyline(g, {color:"#fff", weight:2.4, className:"flow", interactive:false}).addTo(G.route); });
  act.legs.forEach((l, i) => { if(!i || !l.g || !D.geoms[l.g] || act.legs[i-1].mod === "mola") return;
    L.marker(D.geoms[l.g][0], {icon:div(`<div style="width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid ${c}"></div>`, [12,12], [6,6]), interactive:false, keyboard:false}).addTo(G.pts); });
  const end = (pt, col, t) => L.marker(pt, {keyboard:false, zIndexOffset:900, icon:div(`<div class="endpt" style="background:${col}"></div><div class="lbl">${esc(t)}</div>`, [18,18], [9,9])}).addTo(G.pts);
  end(state.trip.from.pt, "#1F2937", state.trip.from.ad); end(state.trip.to.pt, "#C1125A", state.trip.to.ad);
  if(act.mola_poi && POI_BY_ID[act.mola_poi]){ const p = POI_BY_ID[act.mola_poi], g = p.kat === "lokanta" ? "fork" : p.kat === "spor" ? "dumbbell" : "museum";
    L.marker([p.lat, p.lon], {zIndexOffset:1000, keyboard:false, icon:div(`<div class="stopmk"><span class="pl"></span><span class="core" style="background:${KAT[p.kat].renk}">${svg(g,15,2.4,"#fff")}</span></div>`, [44,44], [22,22])}).bindPopup(poiPopup(p)).addTo(G.pts); }
  D.pois.forEach(p => { if(!state.kat[p.kat] || p.id === act.mola_poi) return;
    L.marker([p.lat, p.lon], {icon:poiIcon(p), keyboard:false}).bindPopup(poiPopup(p)).addTo(G.pois); });
  if(state.kat.kopru) D.bridges.forEach(b => { const v = s.trafik[b.id], bc = v < 35 ? "#E30613" : v < 45 ? "#FBB034" : "#12A150";

function setSnap(snap, refit = true){
  M.snap = snap;
  const h = SNAP()[snap];
  document.documentElement.style.setProperty("--sheet", h + "px");
  $("grab").setAttribute("aria-label", snap === "full" ? "Paneli küçült" : "Paneli büyüt");
  $("btnFit").hidden = snap === "full";

}
(() => {   // sürükle-bırak; kesilen dokunuşlar (pointercancel) temizlenir
  const g = $("grab"), sh = $("sheet"); let y0 = 0, h0 = 0, id = null, moved = false;
  const end = e => { if(id === null) return; sh.classList.remove("dragging");
    const h = sh.getBoundingClientRect().height, S = SNAP();
    if(!moved){ setSnap(M.snap === "full" ? "half" : M.snap === "half" ? "full" : "half"); }
    else setSnap(Object.keys(S).reduce((a, k) => Math.abs(S[k] - h) < Math.abs(S[a] - h) ? k : a, "half"));
    try{ g.releasePointerCapture(id); }catch(_){} id = null; };
  g.addEventListener("pointerdown", e => { id = e.pointerId; y0 = e.clientY; h0 = sh.getBoundingClientRect().height; moved = false; g.setPointerCapture(id); sh.classList.add("dragging"); });
  g.addEventListener("pointermove", e => { if(e.pointerId !== id) return; const dy = y0 - e.clientY; if(Math.abs(dy) > 6) moved = true;
    const S = SNAP(); document.documentElement.style.setProperty("--sheet", Math.max(S.peek - 40, Math.min(S.full, h0 + dy)) + "px"); });
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end); g.addEventListener("lostpointercapture", end);
  g.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); setSnap(M.snap === "full" ? "half" : "full"); } });
})();

      <span class="text-body">${l}${KAT_SAY[k] ? ` <span class="text-ui-light">${KAT_SAY[k]}</span>` : ""}</span><button class="sw" role="switch" aria-checked="${state.kat[k]}" data-kat="${k}" aria-label="${l}"></button></div>`).join("")}</div>
    <h2 class="text-title mt-6" style="font-weight:600">Veri</h2>
    <p class="text-description text-ui-muted mt-1">Rotalar İBB GTFS (raylı ve vapur) sefer verisinden; Metrobüs süreleri tahminî. Köprü hızları: ${esc(D.trafik_kaynak || "simülasyon")}. Kent Lokantası, spor tesisi ve müze konumları İBB açık verisinden. Ücretler, hava ve senaryolar simülasyondur.</p>
    <p class="text-description text-ui-muted mt-3">İst-Route bağımsız bir datathon prototipidir; İBB'nin resmî uygulaması değildir.</p>
  </div>`;
}
function renderSheet(){
  const b = $("sheetBody"), keepScroll = M.tab !== "ai" ? b.scrollTop : 0;
  b.innerHTML = M.tab === "rota" ? tabRota() : M.tab === "ai" ? tabAi() : M.tab === "cuzdan" ? tabCuzdan() : tabAyar();
  b.style.overflowY = M.tab === "ai" ? "hidden" : "auto";
  if(M.tab === "ai"){ const ch = $("chat"); if(ch) ch.scrollTop = ch.scrollHeight; } else b.scrollTop = keepScroll;
}
function render(opts = {}){
  renderTop(); renderSheet(); drawMap(!!opts.forceFocus);
}

/* ================= etkileşim ================= */
function selectRoute(id){
  const r = step().rotalar.find(x => x.id === id); if(!r) return;
  if(r.iptal){ toast(esc(r.uyari || "Bu rota şu an kullanılamıyor")); return; }
  if(sim.on && !sim.done && sim.locked){ toast("Açık denizde rota değişmez; iskelede değiştirebilirsin."); return; }
  if(sim.on) simStop();
  state.aktif = id; render({forceFocus:true});
}
function setSaat(h){ if(sim.on && !sim.done) return; state.saat = h; render(); }
function hemenCik(){
  const d = new Date(); let s = Math.ceil((d.getHours() * 60 + d.getMinutes()) / 30) * 30;
  const clip = s < 360 || s > 1410; s = Math.min(1410, Math.max(360, s));
  state.zamanMod = "kalkis"; setSaat(fmt(s));
  toast(`Kalkış ${fmt(s)}.${clip ? " Simülasyon 06:00–23:30 arasını kapsar." : ""}`);
}
Object.assign(hooks, {
  onTripChanged(){ if(sim.on) simStop(); },
  render, setSaat, hemenCik,
  setAile(){ state.mod = "aile"; render(); }
});

$("sheetBody").addEventListener("click", e => {
  const t = e.target;
  const opt = t.closest(".opt"); if(opt){ selectRoute(opt.dataset.id); return; }
  if(t.closest("#btnStart")){ simStart(); return; }
  if(t.closest("#simPlay")){ simToggle(); return; }
  if(t.closest("#simSpeed")){ state.speed = SPEEDS[(SPEEDS.indexOf(state.speed) + 1) % SPEEDS.length]; renderSheet(); return; }
  if(t.closest("#simStop")){ simStop(); render(); return; }
  const zm = t.closest("[data-zm]"); if(zm){ state.zamanMod = zm.dataset.zm; if(state.zamanMod === "varis"){ const r = aktifRota(); state.hedef = Math.min(1440, Math.ceil((toMin(state.saat) + r.sure + r.mola) / 30) * 30); } render(); return; }
  const h = t.closest("[data-h]"); if(h && !h.disabled){ setSaat(h.dataset.h); return; }
  if(t.closest("#tNow")){ hemenCik(); return; }
  if(t.closest("#profBtn")){ M.profOpen = !M.profOpen; renderSheet(); return; }
  const q = t.closest("[data-q]"); if(q){ aiAskM(q.dataset.q); return; }
  const act = t.closest("[data-act]"); if(act){ const m = ai.msgs.find(x => x.id === act.dataset.act); if(m && m.act){ m.act.fn(); m.act = null; renderSheet(); } return; }
  if(t.closest("#swAile")){ state.mod = state.mod === "aile" ? "bireysel" : "aile"; render(); return; }
  const oto = t.closest("[data-oto]"); if(oto){ const u = state.aile.uyeler.find(x => x.id === oto.dataset.oto); u.oto = !u.oto; renderSheet(); return; }
  const tr = t.closest("[data-trip]"); if(tr){ kidTrip(tr.dataset.trip); return; }
  const y = t.closest("[data-yolcu]"); if(y){ state.aile.yolcu = y.dataset.yolcu; renderSheet(); return; }
  const kr = t.closest("[data-kriz]"); if(kr){ if(sim.on) simStop(); state.kriz = kr.dataset.kriz; render({forceFocus:true}); if(state.kriz !== "normal") toast(esc(D.meta.krizler[state.kriz].baslik) + " (simülasyon)"); return; }
  const ka = t.closest("[data-kat]"); if(ka){ state.kat[ka.dataset.kat] = !state.kat[ka.dataset.kat]; renderSheet(); drawMap(false); return; }
});
$("sheetBody").addEventListener("input", e => {
  if(e.target.id !== "tSlider") return;
  const v = +e.target.value;
  if(state.zamanMod === "varis"){
    state.hedef = 420 + v * 30; $("tVal").textContent = fmt(state.hedef);
    const h = cikisBul(state.hedef); if(h){ state.saat = h; renderTop(); drawMap(false); }
  } else { state.saat = SAATLER[v]; $("tVal").textContent = state.saat; renderTop(); drawMap(false); }
});
$("sheetBody").addEventListener("change", e => {
  const t = e.target;
  if(t.id === "tSlider"){ renderSheet(); return; }
  if(t.dataset.pf){ ai.profile[t.dataset.pf] = t.type === "number" ? Math.max(0, +t.value || 0) : t.value; renderSheet(); return; }
  if(t.dataset.hedef){ const u = state.aile.uyeler.find(x => x.id === t.dataset.hedef); u.hedef = DURAKLAR.find(d => d.ad === t.value) || u.hedef; render(); }
});
$("sheetBody").addEventListener("submit", e => { if(e.target.id !== "aiForm") return; e.preventDefault(); const v = $("aiIn").value; aiAskM(v); });
/* ---------- Streamlit köprüsü (app.py ?view=mobile): hazır sinyali + isteğe bağlı Gemini ---------- */
const ST_HOST = window.parent !== window;
const HOST = {gemini:false};
const stPost = (type, extra) => { try{ window.parent.postMessage({isStreamlitMessage:true, type, ...extra}, "*"); }catch(_){} };
if(ST_HOST){ stPost("streamlit:componentReady", {apiVersion:1}); stPost("streamlit:setFrameHeight", {height:innerHeight}); }
const hostOut = {route_context:null, ask:null, taha:false};
addEventListener("message", e => {
  const d = e.data; if(!d || d.type !== "streamlit:render" || !d.args) return;
  HOST.gemini = !!d.args.gemini;
  let changed = false;
  Object.entries(d.args.replies || {}).forEach(([id, txt]) => {
    const m = ai.msgs.find(x => x.id === id); if(!m || m.gemini !== undefined) return;
    m.gemini = !!(txt && txt.trim()); if(m.gemini) m.text = txt.trim(); changed = true;
  });
  if(changed && M.tab === "ai") renderSheet();
});
function aiAskM(q){
  q = String(q || "").trim(); if(!q) return;
  ai.msgs.push({id:"m" + (++ai.seq), role:"me", text:q});
  let res; try{ res = aiAnswer(q); }catch(err){ console.error(err); res = {text:"Bu soruyu yanıtlarken bir sorun oluştu. Farklı bir şekilde sorar mısın?"}; }
  const id = "a" + (++ai.seq);
  ai.msgs.push({id, role:"bot", text:res.text,
    act: res.act || (res.route && res.route.id !== aktifRota().id ? {lbl:`Haritada göster: ${res.route.tip}`, fn:() => selectRoute(res.route.id)} : null)});
  if(ST_HOST && HOST.gemini){ hostOut.ask = {id, q, draft:res.text}; stPost("streamlit:setComponentValue", {value:JSON.parse(JSON.stringify(hostOut)), dataType:"json"}); }
  if(M.tab === "ai") renderSheet();
  setTimeout(() => $("aiIn")?.focus(), 30);
}
function setTab(tab){
  M.tab = tab;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  renderSheet();
  setSnap(tab === "rota" ? (M.snap === "peek" ? "half" : M.snap) : "full", tab === "rota");
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if(b) setTab(b.dataset.tab); });
$("chipTime").addEventListener("click", () => { M.timeOpen = !M.timeOpen; if(M.tab !== "rota") setTab("rota"); else renderSheet(); if(M.snap === "peek") setSnap("half"); $("sheetBody").scrollTop = 0; });
$("chipWx").addEventListener("click", () => setTab("ayar"));
$("btnFit").addEventListener("click", fitRoute);
$("btnSwap").addEventListener("click", () => { state.trip = {from:state.trip.to, to:state.trip.from}; tripChanged(); render({forceFocus:true}); });

/* ---------- arama ekranı ---------- */
function openSearch(which){
  M.searchFor = which; $("search").classList.add("open");
  $("sIn").value = ""; $("sIn").placeholder = which === "from" ? "Nereden? Durak, iskele, yer" : "Nereye? Durak, iskele, Kent Lokantası…";
  $("sGps").hidden = which !== "from"; sList(""); setTimeout(() => $("sIn").focus(), 50);
}
function closeSearch(){ $("search").classList.remove("open"); $(M.searchFor === "from" ? "fFrom" : "fTo").focus(); M.searchFor = null; }
function sList(q){
  const items = searchItems(q);
  $("sList").innerHTML = items.length ? items.map((it, i) => {
    const col = it.kind === "ornek" ? "#1F2937" : it.kind === "iskele" ? "#0A7EB9" : KAT[it.kind]?.renk || "#6B7280";
    const ic = it.kind === "iskele" ? "vapur" : it.kind === "lokanta" ? "fork" : it.kind === "spor" ? "dumbbell" : it.kind === "muze" ? "museum" : it.kind === "ornek" ? "star" : "metro";
    return `<button role="option" data-i="${i}" class="w-full flex items-center gap-3 px-4 min-h-[60px] text-left border-b border-gray-50 active:bg-ui-bg">
      <span class="w-9 h-9 rounded-full grid place-items-center text-white flex-none" style="background:${col}">${svg(ic,16,2.2,"#fff")}</span>
      <span class="min-w-0"><span class="block text-title truncate">${esc(it.ad)}</span><span class="block text-description text-ui-muted truncate">${esc(it.alt)}</span></span></button>`;
  }).join("") : `<p class="p-6 text-body text-ui-muted">Sonuç yok. Durak, iskele, Kent Lokantası, spor tesisi ya da müze adı dene.</p>`;
  sList.items = items;
}
function pick(it){
  const other = state.trip[M.searchFor === "from" ? "to" : "from"];
  if(hav(it.pt, other.pt) < 150){ toast("Kalkış ve varış aynı nokta olamaz."); return; }
  state.trip[M.searchFor] = {ad:it.ad, alt:it.alt, pt:it.pt, key:it.key};
  tripChanged(); closeSearch(); if(M.tab !== "rota") setTab("rota");
  render({forceFocus:true});
}
$("fFrom").addEventListener("click", () => openSearch("from"));
$("fTo").addEventListener("click", () => openSearch("to"));
$("sBack").addEventListener("click", closeSearch);
$("sIn").addEventListener("input", e => sList(e.target.value));
$("sIn").addEventListener("keydown", e => { if(e.key === "Enter" && sList.items?.length){ e.preventDefault(); pick(sList.items[0]); } if(e.key === "Escape") closeSearch(); });
$("sList").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if(b) pick(sList.items[+b.dataset.i]); });
$("sGps").addEventListener("click", () => {
  if(!navigator.geolocation){ toast("Bu tarayıcı konum paylaşmayı desteklemiyor."); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const pt = [pos.coords.latitude, pos.coords.longitude];
    if(pt[0] < 40.75 || pt[0] > 41.35 || pt[1] < 28 || pt[1] > 29.95){ toast("Konumun İstanbul ağının dışında görünüyor; kalkışı aramadan seç."); return; }
    const near = N.reduce((a, n) => hav(pt, n.pt) < hav(pt, a.pt) ? n : a, N[0]);
    pick({ad:"Konumum", alt:`En yakın durak: ${near.ad}`, pt, key:"gps"});
  }, err => toast(err.code === 1 ? "Konum izni verilmedi. Tarayıcı ayarlarından izin ver ya da aramadan seç." : "Konum alınamadı; tekrar dene ya da aramadan seç."), {timeout:8000, maximumAge:60000});
});

/* ================= canlı yolculuk ================= */
const sim = {on:false, playing:false, done:false, t:0, total:0, segs:[], legIdx:-1, raf:0, last:0, marker:null, trail:null, locked:false, fares:0, binis:0, mpuan:false, lastPan:0};
const dist = (a, b) => Math.hypot((b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180), b[0] - a[0]);
function buildSegs(r){
  let t = 0, last = state.trip.from.pt;
  return r.legs.map((l, i) => {
    let pts = l.g && D.geoms[l.g] ? D.geoms[l.g] : null;
    if(!pts){ const p = l.mod === "mola" && POI_BY_ID[r.mola_poi]; pts = p ? [[p.lat, p.lon]] : [last]; }
    const cum = [0]; for(let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + dist(pts[k - 1], pts[k]));
    const s = {i, l, t0:t, t1:t + l.dk, pts, cum, len:cum[cum.length - 1]}; t += l.dk; last = pts[pts.length - 1]; return s;
  });
}
function posAt(s, f){
  if(s.pts.length === 1 || !s.len) return s.pts[0];
  const d = f * s.len; let k = 1; while(k < s.cum.length - 1 && s.cum[k] < d) k++;
  const a = s.pts[k - 1], b = s.pts[k], u = Math.min(1, (d - s.cum[k - 1]) / (s.cum[k] - s.cum[k - 1] || 1));
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
}
const vehIcon = (m, c) => div(`<div class="veh" style="--vc:${m === "mola" ? "#FBB034" : c}"><span class="ring"></span><span class="core">${svg(m === "mola" ? "mola" : ICO[m] ? m : "yurume",18,2.2,"#fff")}</span></div>`, [38,38], [19,19]);
function simStart(){
  const r = aktifRota(); if(!r || r.iptal) return;
  simStop(true);
  Object.assign(sim, {on:true, playing:true, done:false, t:0, segs:buildSegs(r), legIdx:-1, locked:false, fares:0, binis:0, mpuan:false});
  sim.total = sim.segs.length ? sim.segs[sim.segs.length - 1].t1 : 0;
  sim.trail = L.polyline([], {color:"#1F2937", weight:4, opacity:.85, interactive:false}).addTo(G.sim);
  sim.marker = L.marker(state.trip.from.pt, {zIndexOffset:2000, interactive:false, keyboard:false, icon:vehIcon("yurume", ROUTE_COL[r.renk])}).addTo(G.sim);
  setSnap("peek", false); fitRoute();
  sim.last = performance.now(); sim.raf = requestAnimationFrame(frame); renderSheet();
}
function simStop(silent){
  cancelAnimationFrame(sim.raf); G.sim.clearLayers();
  Object.assign(sim, {on:false, playing:false, done:false, t:0, legIdx:-1, marker:null, trail:null, locked:false});
  if(!silent) renderSheet();
}
function simToggle(){
  if(!sim.on || sim.done){ simStart(); return; }
  sim.playing = !sim.playing;
  if(sim.playing){ sim.last = performance.now(); sim.raf = requestAnimationFrame(frame); } else cancelAnimationFrame(sim.raf);
  renderSheet();
}
function frame(ts){
  if(!sim.playing) return;
  const dt = Math.min(.1, (ts - sim.last) / 1000); sim.last = ts;
  const cur = sim.segs.find(s => sim.t < s.t1) || sim.segs[sim.segs.length - 1];
  sim.t = Math.min(sim.total, sim.t + dt * 2.4 * state.speed * (cur.l.mod === "mola" ? 4 : 1));
  apply();
  if(sim.t >= sim.total){ finish(); return; }
  sim.raf = requestAnimationFrame(frame);
}
function apply(){
  const seg = sim.segs.find(s => sim.t < s.t1) || sim.segs[sim.segs.length - 1];
  if(seg.i !== sim.legIdx){ if(!legChange(seg)) return; }
  const f = seg.l.dk ? (sim.t - seg.t0) / seg.l.dk : 1, pos = posAt(seg, Math.max(0, Math.min(1, f)));
  sim.marker.setLatLng(pos);
  const tr = []; for(const s of sim.segs){ if(s.i < seg.i) tr.push(...s.pts); else if(s.i === seg.i){ const d = f * s.len; for(let k = 0; k < s.pts.length && s.cum[k] <= d; k++) tr.push(s.pts[k]); tr.push(pos); break; } }
  sim.trail.setLatLngs(tr);
  if(performance.now() - sim.lastPan > 800){ sim.lastPan = performance.now(); if(!map.getBounds().pad(-.15).contains(pos)) map.panTo(pos, {animate:true, duration:.6}); }
  const bar = $("simBar"); if(bar){ bar.style.width = (sim.t / sim.total * 100).toFixed(1) + "%"; $("simClock").textContent = fmt(toMin(state.saat) + sim.t); $("simSub").textContent = `${Math.max(0, Math.ceil(seg.t1 - sim.t))} dk · varış ${varis(aktifRota())}`; }
}
function legChange(seg){
  const prev = sim.legIdx >= 0 ? sim.segs[sim.legIdx] : null, r = aktifRota(), m = seg.l.mod;
  if(BINIS.has(m) && !charge(m)){ sim.playing = false; cancelAnimationFrame(sim.raf); sim.t = seg.t0; renderSheet(); return false; }
  sim.legIdx = seg.i;
  sim.marker.setIcon(vehIcon(m, ROUTE_COL[r.renk]));
  if(prev && prev.l.mod === "mola" && !sim.mpuan && r.puan){ sim.mpuan = true; state.puan += r.puan; toast(`+${r.puan} İBB Puanı · yalnızca ${KAPALI.join(", ")}'te geçerli`); }
  const was = sim.locked; sim.locked = m === "vapur";
  if(sim.locked && !was) toast(`Açık denizdesin · rota ${esc(iskele(seg.l))} kadar kilitli`);
  if(m === "mola") toast(`Mola başladı · ${esc(POI_BY_ID[r.mola_poi]?.isim || "")}`);
  renderSheet(); return true;
}
function finish(){
  sim.playing = false; sim.done = true; cancelAnimationFrame(sim.raf); sim.locked = false;
  const r = aktifRota(); if(r.mola && !sim.mpuan && r.puan){ sim.mpuan = true; state.puan += r.puan; }
  toast(`Varış ${fmt(toMin(state.saat) + sim.total)} · ${esc(state.trip.to.ad)} · ücret ${tl(sim.fares)}`);
  simStop(true); setSnap("half"); render();
}
/* ---------- cüzdan (temsilî tarife) ---------- */
const fare = tip => Math.round((tip === "ogrenci" ? UCRET.ogrenci : UCRET.tam) * (sim.binis ? UCRET.aktarma_orani : 1) * 100) / 100;
function topUp(u){
  const a = state.aile; if(!u.oto || u.bakiye >= a.esik || a.master.bakiye < a.yukleme) return;
  a.master.bakiye -= a.yukleme; u.bakiye += a.yukleme; toast(`${esc(u.ad)}'in kartına ana karttan ${tl(a.yukleme)} otomatik yüklendi`);
}
function charge(mod){
  const u = traveler();
  if(u){ const f = fare(u.tip); if(u.bakiye < f) topUp(u);
    if(u.bakiye < f){ toast(`${esc(u.ad)}: yetersiz bakiye. Cüzdan'dan otomatik yüklemeyi aç ve devam et.`); return false; }
    u.bakiye -= f; topUp(u); sim.fares += f; sim.binis++; return true; }
  const f = fare("tam");
  if(state.mod === "aile"){ state.aile.master.bakiye -= f; sim.fares += f; sim.binis++; return true; }
  if(state.bakiye < f){ toast("Yetersiz bakiye · İstanbulkart'ını yükle."); return false; }
  state.bakiye -= f; sim.fares += f; sim.binis++; return true;
}
function kidTrip(id){
  const u = state.aile.uyeler.find(x => x.id === id), f = UCRET.ogrenci;
  if(u.bakiye < f) topUp(u);
  if(u.bakiye < f){ toast(`${esc(u.ad)}: yetersiz bakiye.`); return; }
  u.bakiye -= f; topUp(u); render();
}

/* ================= açılış ================= */
window.__istRoute = {state, sim, D, M,
  audit(){ return {markers:document.querySelectorAll(".leaflet-marker-pane > *").length, paths:document.querySelectorAll(".leaflet-overlay-pane path").length}; }};
setSnap("half", false);
render({forceFocus:true});
new ResizeObserver(() => {
  const b = $("map").getBoundingClientRect();
  if(b.width && b.height){ map.invalidateSize(false); if(pendingFit){ setSnap(M.snap, false); fitRoute(); } }
}).observe($("map"));
addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => setSnap(M.snap), 200); });
})();
</script>
