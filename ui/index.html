<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İst-Route · Akıllı Ulaşım & Teşvik Prototipi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --navy:#0B2545; --cyan:#00A3E0; --red:#E30613; --yellow:#FBB034; --bg:#F8FAFC;
  --orange:#F07A1A; --purple:#7B3FE4; --green:#12A150; --green-ink:#0B7A3B;
  --yellow-ink:#7A4F00; --red-ink:#C00510; --cyan-ink:#0079A8;
  --ink:#0B2545; --ink-2:#3E556F; --ink-3:#5B6C82; --line:rgba(11,37,69,.10);
  --glass:rgba(255,255,255,.76); --glass-strong:rgba(255,255,255,.93);
  --glass-border:rgba(255,255,255,.7); --chip:rgba(11,37,69,.055);
  --shadow:0 10px 30px rgba(11,37,69,.08); --shadow-lg:0 22px 50px rgba(11,37,69,.18);
  --r:16px; --r-sm:12px; --blur:blur(12px) saturate(160%);
  --ease:cubic-bezier(.2,.8,.2,1);
  --focus:#0B2545;
  --panel-w:392px; --sheet-h:0px;
}
[data-theme="dark"]{
  --ink:#EAF2FB; --ink-2:#B4C4D7; --ink-3:#93A6BD; --line:rgba(255,255,255,.10);
  --glass:rgba(11,24,44,.74); --glass-strong:rgba(11,24,44,.93);
  --glass-border:rgba(255,255,255,.08); --chip:rgba(255,255,255,.07);
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 22px 50px rgba(0,0,0,.5);
  --bg:#06121F; --yellow-ink:#FBB034; --red-ink:#FF6B74; --cyan-ink:#36BDF0; --green-ink:#3CCB7F;
  --focus:#00A3E0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);
  font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:rgba(0,163,224,.28);color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-60px;z-index:2000;padding:10px 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;font-size:13px;text-decoration:none}
.skip:focus{top:16px}

#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{font-family:inherit;background:var(--bg)}
.leaflet-control-attribution{background:var(--glass)!important;backdrop-filter:var(--blur);
  border-radius:8px 0 0 0;font-size:11px;color:var(--ink-2)!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}

.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--shadow)}

/* ================= left panel: brand + trip + time + routes ================= */
.panel{position:fixed;top:16px;left:16px;width:var(--panel-w);max-height:calc(100% - 32px);z-index:450;display:flex;flex-direction:column;overflow:visible}
.panel-scroll{min-height:0;overflow-y:auto;padding:14px 14px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;border-radius:var(--r)}
.p-head{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--navy),#16407a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand-t{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.1}
.brand-t span{color:var(--cyan)}
.brand-s{font-size:11.5px;color:var(--ink-3);font-weight:600}

.trip{position:relative;display:flex;flex-direction:column;gap:4px;padding:8px 52px 8px 10px;border-radius:var(--r-sm);background:var(--chip)}
.trip::before{content:"";position:absolute;left:19px;top:30px;bottom:30px;border-left:2px dotted var(--ink-3);opacity:.6}
.trip-row{display:flex;align-items:center;gap:10px;min-height:44px}
.fld{flex:1;min-width:0;display:flex;flex-direction:column}
.fld label{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.fld input{width:100%;border:0;background:transparent;font:inherit;font-size:14px;font-weight:800;color:var(--ink);padding:2px 0;border-bottom:1.5px solid transparent;outline:none;text-overflow:ellipsis}
.fld input::placeholder{color:var(--ink-3);font-weight:600}
.fld input:focus{border-bottom-color:var(--cyan)}
.fld small{font-size:11.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gps{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--ink-2);background:var(--glass-strong)}
.gps:hover{color:var(--cyan-ink)}
.gps[aria-busy="true"] svg{animation:spin 1s linear infinite}
.swap{position:absolute;right:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--glass-strong);color:var(--ink-2);box-shadow:0 1px 4px rgba(11,37,69,.12)}
.swap:hover{color:var(--cyan-ink)}
.sugg{position:fixed;z-index:800;width:340px;max-height:320px;overflow-y:auto;padding:6px;display:none;flex-direction:column;background:var(--glass-strong);box-shadow:var(--shadow-lg)}
.sugg.open{display:flex}
.sg{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;cursor:pointer}
.sg[aria-selected="true"],.sg:hover{background:var(--chip)}
.sg i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;font-style:normal}
.sg b{display:block;font-size:13.5px;font-weight:800}
.sg span{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.sg-empty{padding:12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.net-note{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:-6px}
.seg2{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--chip)}
.seg2 button{flex:1;font-size:12.5px;font-weight:800;padding:7px 10px;border-radius:8px;color:var(--ink-2)}
.seg2 button.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 6px rgba(11,37,69,.12)}
.now-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:8px 12px;border-radius:10px;background:var(--navy);color:#fff;align-self:flex-start}
[data-theme="dark"] .now-btn{background:var(--cyan);color:#04121f}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dot.o{background:var(--navy)} .dot.d{background:var(--red)}
[data-theme="dark"] .dot{border-color:#0b182c}

.time-wrap{position:relative;display:flex;align-items:center;gap:8px}
.time-pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 10px;border-radius:999px;background:var(--chip);font-size:13.5px;font-weight:800;transition:background .2s}
.time-pill:hover{background:rgba(0,163,224,.12)}
.time-pill .peak{color:var(--red-ink)} .time-pill .calm{color:var(--green-ink)}
.time-pill[aria-expanded="true"] svg.chev{transform:rotate(180deg)}
.time-pill svg.chev{transition:transform .2s var(--ease)}
.time-note{font-size:11.5px;font-weight:600;color:var(--ink-3)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:-4px}
.sec-h h2{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sec-h span{font-size:12px;color:var(--ink-3);font-weight:600}

/* route cards */
.routes{display:flex;flex-direction:column;gap:10px}
.rc{--c:var(--red);--c-ink:var(--red-ink);position:relative;display:flex;flex-direction:column;text-align:left;width:100%;padding:13px 14px 12px;border-radius:var(--r);cursor:pointer;
  background:var(--glass-strong);border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(11,37,69,.05);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease),background-color .35s var(--ease),opacity .3s,filter .3s}
.rc[data-renk="mavi"]{--c:var(--cyan);--c-ink:var(--cyan-ink)} .rc[data-renk="sari"]{--c:var(--yellow);--c-ink:var(--yellow-ink)}
.rc:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.rc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--glass-strong));box-shadow:0 12px 30px color-mix(in srgb,var(--c) 26%,transparent)}
.rc.rc-pop{animation:pop .45s var(--ease)}
.rc.shake{animation:shake .45s var(--ease)}
.rc.locked:not(.on),.rc.iptal{opacity:.55;filter:grayscale(.55);cursor:not-allowed}
.rc.locked:not(.on):hover,.rc.iptal:hover{transform:none;box-shadow:0 2px 8px rgba(11,37,69,.05);border-color:var(--line)}
.rc.iptal .rc-time{text-decoration:line-through;text-decoration-thickness:2px}
.rc-row{display:flex;align-items:center;gap:8px}
.rc-time{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
.rc-time .mola{font-size:14px;font-weight:800;letter-spacing:-.01em;color:var(--yellow-ink)}
.score{margin-left:auto;position:relative;flex:none}
.score-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:800;color:var(--ink)}
.score-btn small{font-size:11px;font-weight:700;color:var(--ink-3)}
.score-btn:hover{background:color-mix(in srgb,var(--c) 16%,var(--chip))}
/* Sabit konumlu: panelin kaydırma alanı balonu kırpmasın (konum JS ile butona göre hesaplanır) */
.score-pop{position:fixed;width:272px;padding:12px 13px;z-index:20;display:none;flex-direction:column;gap:8px;cursor:auto;background:var(--glass-strong);box-shadow:var(--shadow-lg)}
.score-pop.open{display:flex;animation:menuIn .22s var(--ease)}
.score-pop h3{font-size:13px;font-weight:800}
.score-pop p{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.5}
.sp-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.sp-row span:first-child{flex:1}
.sp-row b{color:var(--ink);font-weight:800}
.sp-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.sp-bar i{display:block;height:100%;border-radius:3px}
.rc-name{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-top:1px;line-height:1.3}
.rc-sub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px;line-height:1.45;text-wrap:pretty}
.rc-sub b{font-weight:800;color:var(--ink)}
.badge-oneri,.badge-lock{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.badge-lock{background:var(--chip);color:var(--ink-2)}
[data-theme="dark"] .badge-oneri{background:var(--cyan);color:#04121f}
.rc-badges{display:flex;gap:6px;margin-top:8px}
.rc-warn{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:800;padding:5px 8px;border-radius:8px;background:rgba(227,6,19,.08);color:var(--red-ink)}
.rc-warn.y{background:rgba(251,176,52,.16);color:var(--yellow-ink)}
.rc-line{display:flex;gap:2px;height:6px;margin-top:10px;border-radius:3px;overflow:hidden}
.rc-line span{height:100%;background:var(--c)}
.rc-line .w{opacity:.35}
.rc-line .m{background:var(--yellow)}
.legs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:8px}
.rc:not(.on) .legs,.rc:not(.on) .rc-foot{display:none}
.rc:not(.on) .rc-line{height:4px}
.leg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 7px;border-radius:8px;background:var(--chip);color:var(--ink-2);transition:all .3s}
.leg svg{width:14px;height:14px}
.leg.mola{background:rgba(251,176,52,.22);color:var(--yellow-ink)}
.leg.now{background:var(--navy);color:#fff}
[data-theme="dark"] .leg.now{background:var(--cyan);color:#04121f}
.leg.done{opacity:.45}
.leg-sep{color:var(--ink-3);opacity:.7;font-size:11px}
.rc-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.pts{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(251,176,52,.22);color:var(--yellow-ink);white-space:nowrap}
.pts.zero{background:var(--chip);color:var(--ink-3)}
.car{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}

/* ================= top-right cluster ================= */
.tr{position:fixed;top:16px;right:16px;z-index:650;display:flex;gap:8px;height:52px}
.tr-item{position:relative;display:flex}
.wx{display:flex;align-items:center;gap:10px;padding:0 14px 0 12px;text-align:left}
.wx-t{font-size:15px;font-weight:800;line-height:1.1;white-space:nowrap}
.wx-s{font-size:11.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.wx[data-s="kritik"]{background:color-mix(in srgb,var(--red) 12%,var(--glass-strong));border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.wx[data-s="kritik"] .wx-s{color:var(--red-ink)}
.wx[data-s="uyari"]{background:color-mix(in srgb,var(--yellow) 16%,var(--glass-strong));border-color:color-mix(in srgb,var(--yellow) 45%,transparent)}
.wx[data-s="uyari"] .wx-s{color:var(--yellow-ink)}
.wallet{display:flex;align-items:center;gap:10px;padding:0 14px 0 10px;text-align:left}
.card-ico{width:30px;height:21px;border-radius:5px;background:linear-gradient(135deg,var(--cyan),#0077b6);position:relative;flex:none}
.card-ico::after{content:"";position:absolute;left:5px;top:6px;width:7px;height:5px;border-radius:2px;background:var(--yellow)}
.wallet-v{font-size:15px;font-weight:800;line-height:1.1;white-space:nowrap}
.wallet-l{font-size:11px;color:var(--ink-3);font-weight:700;white-space:nowrap}
.wallet.bump .wallet-v{animation:bump .6s var(--ease)}
.icon-btn{width:52px;display:grid;place-items:center}
.icon-btn[aria-expanded="true"]{background:var(--navy);color:#fff}
[data-theme="dark"] .icon-btn[aria-expanded="true"]{background:var(--cyan);color:#04121f}

/* popovers (weather/crisis, time, menu) */
.pop{position:absolute;top:calc(100% + 8px);right:0;width:360px;max-height:calc(100vh - 100px);overflow-y:auto;overflow-x:hidden;padding:16px;z-index:30;
  display:none;flex-direction:column;gap:14px;background:var(--glass-strong);box-shadow:var(--shadow-lg);scrollbar-width:thin}
.pop.open{display:flex;animation:menuIn .24s var(--ease)}
.pop.left{left:0;right:auto;width:340px}
.pop h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
.pop p{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.5}
.m-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.m-h h4{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.m-h span{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.m-sep{height:1px;background:var(--line)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt-l{font-size:13px;font-weight:700}
.opt-l small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:1px}
.pills{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--chip)}
.pills button{font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:8px;color:var(--ink-2);transition:all .2s var(--ease)}
.pills button.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 6px rgba(11,37,69,.12)}
.pills button[data-v="lodos"].on{color:var(--red-ink)} .pills button[data-v="mac"].on{color:var(--yellow-ink)}
.wx-stat{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--chip)}
.wx-stat svg{flex:none;margin-top:1px}
.wx-stat b{display:block;font-size:13px;font-weight:800}
.wx-stat span{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.45}
.sim-note{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:10px;background:var(--chip);color:var(--ink-2)}
.preset:hover:not(:disabled){background:rgba(0,163,224,.12)}
.preset.on{background:var(--navy);color:#fff}
[data-theme="dark"] .preset.on{background:var(--cyan);color:#04121f}
.preset:disabled{opacity:.45}
.mclock{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700}
.mclock b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.range{position:relative;height:28px}
.range-track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.range-peak{position:absolute;top:0;bottom:0;background:rgba(227,6,19,.35)}
input[type=range]{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]:disabled{cursor:not-allowed;opacity:.5}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--navy);box-shadow:0 4px 12px rgba(11,37,69,.3)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:5px solid var(--navy)}
[data-theme="dark"] input[type=range]::-webkit-slider-thumb{border-color:var(--cyan)}

/* family wallet (in menu) */
.fam-master{padding:16px;border-radius:14px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0B2545 0%,#123f78 55%,#00A3E0 130%);box-shadow:0 12px 26px rgba(11,37,69,.28)}
.fm-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.9}
.fm-chip{width:30px;height:22px;border-radius:5px;background:linear-gradient(135deg,#ffd27a,#FBB034)}
.fm-v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.fm-s{font-size:12px;font-weight:600;opacity:.85}
.fam-list{display:flex;flex-direction:column;gap:8px}
.kid{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--chip);border:1.5px solid transparent;transition:border-color .3s}
.kid.low{border-color:rgba(227,6,19,.35);background:rgba(227,6,19,.05)}
.kid.flash{animation:flash 1s var(--ease)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.kid-b{flex:1;min-width:0}
.kid-n{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.kid-n small{font-size:11px;color:var(--ink-3);font-weight:700}
.kid-v{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:1px}
.kid-v.low{color:var(--red-ink)}
.kid-a{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mini-btn{font-size:12px;font-weight:800;min-height:32px;padding:0 10px;border-radius:9px;background:var(--glass-strong);box-shadow:0 1px 4px rgba(11,37,69,.12);white-space:nowrap}
.mini-btn:hover{color:var(--cyan-ink)}
.sw-t{position:relative;width:42px;height:26px;border-radius:999px;background:var(--line);transition:background .25s;flex:none}
.sw-t::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw-t.on{background:var(--green-ink)} .sw-t.on::after{transform:translateX(16px)}
.sw-row{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.fam-rule{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--chip)}
.fam-log{display:flex;flex-direction:column;gap:4px;max-height:110px;overflow:auto}
.fam-log div{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;gap:8px}
.fam-log time{color:var(--ink-3);font-weight:800;flex:none}
.trav{display:flex;gap:6px;flex-wrap:wrap}
.trav button{font-size:12.5px;font-weight:800;padding:7px 10px;border-radius:9px;background:var(--chip);color:var(--ink-2)}
.trav button.on{background:var(--navy);color:#fff}
[data-theme="dark"] .trav button.on{background:var(--cyan);color:#04121f}
.own{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--chip)}
.own b{display:block;font-size:15px;font-weight:800}
.own span{font-size:12px;font-weight:600;color:var(--ink-2)}
.kc{display:flex;gap:10px;align-items:flex-start}
.kc-i{width:28px;height:28px;border-radius:8px;background:var(--navy);display:grid;place-items:center;flex:none}
[data-theme="dark"] .kc-i{background:var(--cyan)}
.kc b{font-size:12px;font-weight:800;display:block}
.kc p{font-size:12px;margin-top:2px}

/* ================= layers + zoom ================= */
.layers{position:fixed;top:80px;right:16px;z-index:440;display:flex;gap:6px;padding:6px;align-items:center;max-width:calc(100vw - var(--panel-w) - 64px);overflow-x:auto;scrollbar-width:none}
.layers::-webkit-scrollbar{display:none}
.lc{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:all .2s var(--ease);white-space:nowrap}
.lc .sw{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;opacity:.45;transition:opacity .2s}
.lc .n{font-size:11px;color:var(--ink-3);font-weight:800}
.lc.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(11,37,69,.08)}
.lc.on .sw{opacity:1}
.zoom{position:fixed;right:16px;bottom:16px;z-index:440;display:flex;flex-direction:column;gap:2px;padding:5px}

/* ================= floating mini-player ================= */
.mp{position:fixed;bottom:16px;left:calc(var(--panel-w) + 32px);right:72px;z-index:460;display:flex;justify-content:center;pointer-events:none}
.mp-in{pointer-events:auto;width:min(640px,100%);display:flex;align-items:center;gap:10px;height:58px;padding:0 10px 0 8px;background:var(--glass-strong)}
.mp-play{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--navy);color:#fff;transition:transform .2s var(--ease),background .2s}
.mp-play:hover{transform:scale(1.05)}
.mp-play.run{background:var(--red)}

.mp-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mp-txt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.mp-txt b{color:var(--ink);font-weight:800}
.mp-txt span{overflow:hidden;text-overflow:ellipsis}
.mp-txt.lock{color:var(--cyan-ink)}
.prog{position:relative;height:6px;border-radius:3px;background:var(--line)}
.prog-segs,.prog-fill{position:absolute;inset:0;display:flex;gap:2px;border-radius:3px;overflow:hidden}
.prog-segs span{height:100%;opacity:.28}
.prog-fill{clip-path:inset(0 100% 0 0)}
.prog-fill span{height:100%}
.mp-clock{flex:none;text-align:right;line-height:1.1}

.mp-clock small{font-size:11px;font-weight:700;color:var(--ink-3)}
.sbtn{height:36px;min-width:40px;padding:0 9px;border-radius:10px;background:var(--chip);font-weight:800;font-size:12.5px;color:var(--ink-2);display:grid;place-items:center;flex:none}
.sbtn:hover:not(:disabled){color:var(--ink)}
.sbtn:disabled{opacity:.4}

/* ================= map visuals ================= */
.flow{stroke-dasharray:2 16;animation:flow 1.1s linear infinite}
.alt-line{cursor:pointer;transition:opacity .2s}
.alt-line:hover{opacity:.6!important}
.pin{position:relative;transition:transform .2s var(--ease);transform-origin:50% 100%}
.pin:hover{transform:scale(1.12)}
.rozet{transition:transform .2s var(--ease)}
.rozet:hover{transform:scale(1.18)}
.node{width:14px;height:14px;border-radius:50%;background:#fff;border:3.5px solid var(--nc);box-shadow:0 2px 6px rgba(11,37,69,.3)}
.endpt{width:22px;height:22px;border-radius:50%;background:var(--navy);border:4px solid #fff;box-shadow:0 4px 12px rgba(11,37,69,.4)}
.endpt.d{background:var(--red)}
.endpt-l{position:absolute;left:28px;top:-1px;white-space:nowrap;font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow)}
.stopmk{position:relative;width:52px;height:52px}
.stopmk .pulse,.crowd .pulse{position:absolute;inset:0;border-radius:50%;background:rgba(251,176,52,.45);animation:pulse 1.8s var(--ease) infinite}
.stopmk .pulse.b,.crowd .pulse.b{animation-delay:.9s}
.stopmk .core{position:absolute;inset:8px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 6px 16px rgba(11,37,69,.35)}
.stopmk .lbl,.crowd .lbl{position:absolute;left:58px;top:12px;white-space:nowrap;font-size:12px;font-weight:800;padding:4px 9px;border-radius:9px;background:var(--yellow);color:#3a2600;box-shadow:var(--shadow)}
.crowd{position:relative;width:52px;height:52px}
.crowd .pulse{background:rgba(227,6,19,.4)}
.crowd .core{position:absolute;inset:11px;border-radius:50%;background:var(--red);border:3px solid #fff;display:grid;place-items:center}
.crowd .lbl{background:var(--red);color:#fff}
.cancel,.bridge{width:max-content}
.cancel{transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;padding:6px 10px 6px 7px;border-radius:999px;background:var(--red-ink);color:#fff;box-shadow:0 6px 16px rgba(227,6,19,.35)}
.bridge{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;padding:5px 9px 5px 6px;border-radius:999px;background:var(--glass-strong);box-shadow:var(--shadow);color:var(--ink);border:1.5px solid var(--bc)}
.bridge i{width:18px;height:18px;border-radius:50%;background:var(--bc);display:grid;place-items:center}
.veh{position:relative;width:40px;height:40px}
.veh .core{position:absolute;inset:0;border-radius:50%;background:var(--vc);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(11,37,69,.45)}
.veh .ring2{position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--vc);opacity:.5;animation:pulse 1.6s var(--ease) infinite}
.veh .tag{position:absolute;left:48px;top:8px;white-space:nowrap;font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow)}
.veh.mola .tag{display:none}
.kid-badge{display:flex;align-items:center;gap:6px;width:max-content;transform:translate(-50%,-50%);padding:3px 10px 3px 3px;border-radius:999px;
  background:var(--glass-strong);border:2px solid var(--kc);box-shadow:var(--shadow);font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
.kid-av{width:22px;height:22px;border-radius:50%;background:var(--kc);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.kid-dest{width:16px;height:16px;border-radius:50%;background:var(--kc);border:3px solid var(--glass-strong);box-shadow:0 2px 6px rgba(11,37,69,.35)}
.kid{flex-wrap:wrap}
.kid-goal{flex-basis:100%;min-width:0;display:flex;align-items:center;gap:7px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2)}
.kid-goal select{flex:1;width:0;min-width:0;text-overflow:ellipsis;font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:var(--glass-strong);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.kid-goal span:last-child{white-space:nowrap}
.kid-dot{width:10px;height:10px;border-radius:50%;flex:none}
.leaflet-div-icon{background:none;border:0}
.leaflet-popup-content-wrapper{border-radius:var(--r);background:var(--glass-strong);backdrop-filter:var(--blur);box-shadow:var(--shadow-lg);color:var(--ink);border:1px solid var(--glass-border)}
.leaflet-popup-tip{background:var(--glass-strong)}
.leaflet-popup-content{margin:14px 16px;font-size:12.5px;line-height:1.5;min-width:220px}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-3);top:6px;right:6px}
.pp-k{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-bottom:6px;color:#fff}
.pp-t{font-size:14.5px;font-weight:800;margin-bottom:6px;line-height:1.3}
.pp-r{display:flex;gap:8px;color:var(--ink-2);font-weight:600;margin-top:3px}
.pp-r span:first-child{color:var(--ink-3);min-width:52px}
.pp-s{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px}
.pp-s.ok{background:rgba(18,161,80,.12);color:var(--green-ink)}
.pp-s.no{background:rgba(227,6,19,.1);color:var(--red-ink)}
.pp-note{font-size:11px;color:var(--ink-3);margin-top:6px}
.leaflet-tooltip.legtip{background:var(--glass-strong);color:var(--ink);border:0;border-radius:10px;box-shadow:var(--shadow);font-family:inherit;font-weight:700;font-size:12px;padding:6px 10px}
.leaflet-tooltip.legtip::before{display:none}

.toast{position:fixed;left:calc(50% + var(--panel-w) / 2);top:84px;transform:translate(-50%,-20px);opacity:0;z-index:900;padding:12px 18px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:13.5px;transition:all .45s var(--ease);pointer-events:none;max-width:min(560px,calc(100vw - 24px));background:var(--glass-strong)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--yellow-ink);white-space:nowrap}
.toast>span{line-height:1.45}
.toast>span>svg:first-child{vertical-align:-3px;margin-right:6px}
.fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:1000}
.fatal .glass{padding:24px;max-width:420px}
.brand-mini{display:none}

@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes pop{0%{transform:scale(.98)}45%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25);color:var(--yellow-ink)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(18,161,80,.6)}100%{box-shadow:0 0 0 12px rgba(18,161,80,0)}}
.panel,.layers,.mp-in,.zoom{animation:rise .6s var(--ease) both}
.mp-in{animation-delay:.1s}

/* ================= responsive ================= */
@media (max-width:1180px){ .wx-s{display:none} .wallet-l{display:none} .lc .n{display:none} }
@media (max-width:980px){ :root{--panel-w:340px} .mp{right:64px} }
@media (max-width:820px){
  :root{--panel-w:auto}
  .brand-mini{display:grid;position:fixed;top:10px;left:10px;z-index:650;width:46px;height:46px;place-items:center}
  .tr{top:10px;right:10px;height:46px;gap:6px}
  .wx{padding:0 10px}.wx .wx-t{font-size:14px}
  .wallet{padding:0 10px}.card-ico{display:none}
  .icon-btn{width:46px}
  .pop{position:fixed;top:64px;left:10px;right:10px;width:auto;max-height:calc(100vh - 80px)}
  .pop.left{position:absolute;top:calc(100% + 8px);left:0;right:0;width:auto}
  .layers{top:64px;left:10px;right:10px;max-width:none}
  .zoom{display:none}
  .panel{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:54vh}
  .p-head{display:none}
  .panel-scroll{padding:12px;gap:12px}
  .sec-routes{order:-1}
  .routes{flex-direction:row;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px;padding:2px 12px 6px;gap:10px;scrollbar-width:none}
  .routes::-webkit-scrollbar{display:none}
  .rc{min-width:84%;scroll-snap-align:center}
  .score-pop{width:240px}
  .mp{left:10px;right:10px;bottom:calc(var(--sheet-h) + 18px)}
  .mp-in{height:52px}
  .mp-clock small{display:none}
  .leaflet-bottom.leaflet-right{bottom:calc(var(--sheet-h) + 84px)} /* atıf, alt sayfa ve oynatıcının üstünde */
  .toast{left:50%;top:120px}
}

.zoom{bottom:88px}
.mp{right:168px}
.ai-fab{position:fixed;right:16px;bottom:16px;z-index:470;display:flex;align-items:center;gap:9px;height:56px;padding:0 18px 0 8px;border-radius:999px;
  background:var(--navy);color:#fff;font-size:14px;font-weight:800;box-shadow:0 12px 28px rgba(11,37,69,.35);transition:transform .2s var(--ease),bottom .3s var(--ease)}

.ai-risk{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--line)}

.ai-risk .lv.ok{background:rgba(18,161,80,.12);color:var(--green-ink)}
.ai-risk .lv.hi{background:rgba(227,6,19,.1);color:var(--red-ink)}
.ai-risk button{margin-left:auto;font-size:12px;font-weight:800;color:var(--cyan-ink)}
.ai-prof{display:none;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--chip)}
.ai-prof.open{display:flex}

.ai-prof select,.ai-prof input{width:180px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:var(--glass-strong);border:1px solid var(--line);border-radius:8px;padding:5px 7px}

.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
[data-theme="dark"] .msg.me{background:var(--cyan);color:#04121f}
.msg b{font-weight:800}
.msg ol{margin:4px 0 2px 18px;display:flex;flex-direction:column;gap:2px}
.ai-h,.ai-risk,.ai-prof,.ai-chips,.ai-f{flex:none}

.msg .act{display:inline-block;margin-top:7px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:9px;background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 4px rgba(11,37,69,.12)}
.ai-chips{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none}
.ai-chips::-webkit-scrollbar{display:none}
.ai-chips button{flex:none;font-size:12px;font-weight:800;padding:7px 10px;border-radius:999px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.ai-chips button:hover{background:rgba(0,163,224,.12);color:var(--ink)}
.ai-f{display:flex;gap:8px;padding:10px 12px 12px}
.ai-f input{flex:1;min-width:0;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;outline:none}
.ai-f input:focus{border-color:var(--cyan)}
.ai-f button{width:44px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center}
[data-theme="dark"] .ai-f button{background:var(--cyan);color:#04121f}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
@media (max-width:820px){
  .mp{right:10px;bottom:calc(var(--sheet-h) + 84px)}
  .ai-fab{bottom:calc(var(--sheet-h) + 18px);right:10px;height:52px;padding:0 8px}
  .ai-fab .ai-lbl{display:none}
  .ai{left:10px;right:10px;width:auto;top:64px;bottom:auto;max-height:calc(100vh - 80px)}
}
@media (prefers-reduced-motion:reduce){
  .flow,.stopmk .pulse,.crowd .pulse,.veh .ring2{animation:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const D = /*__IST_PAYLOAD__*/null;

(function(){
if(!D || !window.L){
  document.body.insertAdjacentHTML("beforeend",'<div class="fatal"><div class="glass"><h3>İst-Route yüklenemedi</h3><p style="margin-top:8px;color:var(--ink-2)">'+
    (!D?"Veri paketi bulunamadı. Uygulamayı <code>streamlit run app.py</code> ile başlatın.":"Harita kütüphanesi yüklenemedi; internet bağlantısını kontrol edin.")+'</p></div></div>');
  return;
}

/*__ENGINE__*/
const POP_TRIGGER = {time:"btnTime", wx:"btnWx", menu:"btnMenu"};
/* ================= map ================= */
const map = L.map("map", {zoomControl:false, attributionControl:true, zoomSnap:.25}).setView([41.02, 29.0], 12.5);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
const TILE = {
  light:[ESRI+"World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", ESRI+"World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}"],
  dark:[ESRI+"World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", ESRI+"World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"]
};
map.createPane("labels"); map.getPane("labels").style.zIndex = 390; map.getPane("labels").style.pointerEvents = "none";
let tileLayers = [];
function setTiles(){
  tileLayers.forEach(t => map.removeLayer(t));
  const [base, ref] = TILE[state.tema];
  tileLayers = [
    L.tileLayer(base, {maxZoom:16, maxNativeZoom:16,
      attribution:'Altlık &copy; Esri · Toplu taşıma: İBB GTFS · Raylı hatlar, noktalar, trafik: İBB Açık Veri · Ücret, hava, senaryolar: simülasyon'}).addTo(map),
    L.tileLayer(ref, {maxZoom:16, maxNativeZoom:16, pane:"labels"}).addTo(map)
  ];
  tileLayers[0].bringToBack();
}
// Tek sahiplikli katman grupları: renderMap her çağrıda hepsini temizleyip yeniden çizer.
const LY = {
  rail: L.layerGroup().addTo(map),
  alt: L.layerGroup().addTo(map),
  kids: L.layerGroup().addTo(map), route: L.layerGroup().addTo(map), nodes: L.layerGroup().addTo(map),
  pois: L.layerGroup().addTo(map), bridges: L.layerGroup().addTo(map), kriz: L.layerGroup().addTo(map),
  stop: L.layerGroup().addTo(map)
};
// Simülasyon katmanı ayrı yaşar: yalnızca simülasyon yaşam döngüsü (start/stop) tarafından temizlenir.
const SIMLY = L.layerGroup().addTo(map);
const expected = {markers:0};

function pinIcon(p){
  const k = KAT[p.kat];
  if(p.kat === "muze"){
    return L.divIcon({className:"", iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-12],
      html:`<div class="rozet" style="width:26px;height:26px;border-radius:50%;background:${k.renk};border:2.5px solid #fff;box-shadow:0 3px 10px rgba(11,37,69,.35);display:grid;place-items:center">${svg("museum",13,2.2,"#fff")}</div>`});
  }
  const glyph = p.kat === "lokanta" ? "fork" : "dumbbell";
  return L.divIcon({className:"", iconSize:[32,40], iconAnchor:[16,39], popupAnchor:[0,-34],
    html:`<div class="pin"><svg width="32" height="40" viewBox="0 0 32 40" aria-hidden="true">
      <path d="M16 39c-1.2-5-12-12.6-12-23.2A12 12 0 0 1 28 15.8C28 26.4 17.2 34 16 39z" fill="${k.renk}" stroke="#fff" stroke-width="2.4"/>
      <circle cx="16" cy="15.5" r="8.4" fill="rgba(255,255,255,.18)"/></svg>
      <div style="position:absolute;left:8px;top:7px">${svg(glyph,16,2.3,"#fff")}</div></div>`});
}
function openStatus(p){
  const m = /(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/.exec(p.saat_metin || "");
  if(!m) return "";
  const a = +m[1]*60 + +m[2], b = +m[3]*60 + +m[4], t = toMin(state.saat);
  const ok = t >= a && t < b;
  return `<span class="pp-s ${ok?"ok":"no"}">● ${ok?"Şu an açık":"Bu saatte kapalı"} · ${esc(state.saat)}</span>`;
}
function poiPopup(p, isStop){
  const k = KAT[p.kat];
  return `<span class="pp-k" style="background:${k.renk}">${esc(k.kisa)}</span>
    <div class="pp-t">${esc(p.isim)}</div>
    <div class="pp-r"><span>İlçe</span><span>${esc(p.ilce)}</span></div>
    <div class="pp-r"><span>Saatler</span><span>${esc(p.saat_metin)} · ${esc(p.gunler)}</span></div>
    <div class="pp-r"><span>${p.kat==="spor"?"Branş":p.kat==="lokanta"?"Menü":"Adres"}</span><span>${esc(p.detay)}</span></div>
    <div class="pp-r"><span>Ödül</span><span style="color:var(--yellow-ink);font-weight:800">+${p.odul_puani} İBB Puanı</span></div>
    ${openStatus(p)}
    ${isStop?'<div class="pp-note">★ Sosyal mola rotasının durağı (skor motoru seçti)</div>':""}
    ${p.koordinat_kaynagi!=="CSV"?'<div class="pp-note">Konum adres bazlı yaklaşıktır.</div>':""}`;
}
const routePts = r => { const a = []; r.legs.forEach(l => l.g && D.geoms[l.g] && a.push(...D.geoms[l.g])); return a; };

function renderMap(focus){
  const s = step(), act = aktifRota();
  map.closePopup();
  Object.values(LY).forEach(g => g.clearLayers());   // <- hayalet katman yok
  expected.markers = 0;

  // 0) Raylı sistem ağı (İBB vektör verisi): mevcut hatlar ince düz, inşaattakiler kesikli
  if(state.kat.rail && D.rail){
    const dark = state.tema === "dark";
    D.rail.hatlar.forEach(h => {
      const mevcut = !/inşaat/i.test(h.asama || "");
      h.parcalar.forEach(p => L.polyline(p, {color: dark ? "#9DB4D0" : "#24476F", weight: mevcut ? 3 : 2,
        opacity: mevcut ? .55 : .35, dashArray: mevcut ? null : "5 6", interactive:true})
        .bindTooltip(`${esc(h.ad)}${mevcut ? "" : " · inşaat aşamasında"}`, {sticky:true, className:"legtip"}).addTo(LY.rail));
    });
  }

  // 1) Alternatif rotalar (iptal olanlar çizilmez)
  s.rotalar.filter(r => r.id !== act.id && !r.iptal).forEach(r => {
    r.legs.forEach(l => {
      const g = l.g && D.geoms[l.g]; if(!g) return;
      L.polyline(g, {color:COL[r.renk], weight:5, opacity:.3, lineCap:"round", lineJoin:"round",
        dashArray: l.mod==="yurume" ? "1 9" : null, className:"alt-line"})
        .on("click", () => selectRoute(r.id))
        .bindTooltip(`${r.ikon} ${esc(r.tip)} · ${r.sure} dk · varış ${varis(r)}`, {sticky:true, className:"legtip", direction:"top"})
        .addTo(LY.alt);
    });
  });

  // 1b) Aile Modu: çocuk rotaları (çocuğa özel renk; beyaz zemin çizgisi yok, beyaz aktarmaya ayrılmış).
  // Aktif rotanın üstünde çizilir ki ortak hatlarda kaybolmasın.
  const drawKids = () => { if(state.mod !== "aile") return;
    state.aile.uyeler.forEach(u => {
      const kr = kidRoute(u); if(!kr) return;
      let best = null, bestLen = -1;
      kr.legs.forEach(l => {
        const g = l.g && D.geoms[l.g]; if(!g) return;
        const walk = l.mod === "yurume";
        L.polyline(g, {color:u.renk, weight: walk ? 3.5 : 4.5, opacity:.95, lineCap:"round", lineJoin:"round", dashArray: walk ? "0.1 8" : "9 7"})
          .bindTooltip(`${esc(u.ad)} · ${esc(MOD_TR[l.mod]||l.mod)} · ${l.dk} dk<br><span style="font-weight:600;color:var(--ink-2)">${esc(l.ad)}</span>`, {sticky:true, className:"legtip", direction:"top"})
          .addTo(LY.kids);
        if(!walk && g.length && l.dk > bestLen){ bestLen = l.dk; best = g; }
      });
      const mid = best ? best[Math.floor(best.length / 2)] : u.hedef.pt;
      L.marker(mid, {keyboard:false, zIndexOffset:700, icon:L.divIcon({className:"", iconSize:[0,0], iconAnchor:[0,0],
        html:`<div class="kid-badge" style="--kc:${u.renk}"><span class="kid-av">${esc(u.ad[0])}</span>${esc(u.ad)} · ${kr.sure} dk</div>`})})
        .bindTooltip(`${esc(u.ad)}: ${esc(state.trip.from.ad)} → ${esc(u.hedef.ad)} · ${esc(kr.ozet)}`, {className:"legtip", direction:"top", offset:[0,-16]}).addTo(LY.kids);
      L.marker(u.hedef.pt, {keyboard:false, interactive:false, icon:L.divIcon({className:"", iconSize:[16,16], iconAnchor:[8,8],
        html:`<div class="kid-dest" style="--kc:${u.renk}"></div>`})}).addTo(LY.kids);
      expected.markers += 2;
    });
  };

  // 2) Aktif rota: zemin + renk + akan canlı hat
  const c = COL[act.renk];
  act.legs.forEach(l => {
    const g = l.g && D.geoms[l.g]; if(!g) return;
    const walk = l.mod === "yurume", sea = l.mod === "vapur";
    L.polyline(g, {color: state.tema==="dark"?"#0b182c":"#fff", weight: walk?9:12, opacity:.95, lineCap:"round", lineJoin:"round", interactive:false}).addTo(LY.route);
    L.polyline(g, {color:c, weight: walk?5:7, opacity:1, lineCap: sea?"butt":"round", lineJoin:"round",
      dashArray: walk ? "0.1 10" : sea ? "14 8" : null})
      .bindTooltip(`${esc(MOD_TR[l.mod]||l.mod)} · ${l.dk} dk<br><span style="font-weight:600;color:var(--ink-2)">${esc(l.ad)}</span>`, {sticky:true, className:"legtip", direction:"top"})
      .addTo(LY.route);
    if(!walk && !sea) L.polyline(g, {color:"#fff", weight:2.6, opacity:.95, lineCap:"round", className:"flow", interactive:false}).addTo(LY.route);
  });

  drawKids();

  // 3) Aktarma düğümleri (durak adı üzerine gelince) + uç noktalar
  act.legs.forEach((l, i) => {
    if(i === 0 || !l.g || !D.geoms[l.g]) return;
    if(act.legs[i-1].mod === "mola") return;
    L.marker(D.geoms[l.g][0], {icon:L.divIcon({className:"", iconSize:[14,14], iconAnchor:[7,7], html:`<div class="node" style="--nc:${c}"></div>`}), keyboard:false})
      .bindTooltip(`Aktarma · ${esc(MOD_TR[l.mod]||"")}<br><span style="font-weight:600;color:var(--ink-2)">${esc(l.ad)}</span>`, {className:"legtip", direction:"top", offset:[0,-6]})
      .addTo(LY.nodes);
    expected.markers++;
  });
  const end = (pt, cls, lbl) => { L.marker(pt, {icon:L.divIcon({className:"", iconSize:[22,22], iconAnchor:[11,11],
      html:`<div class="endpt ${cls}"></div><div class="endpt-l">${esc(lbl)}</div>`}), keyboard:false, zIndexOffset:900}).addTo(LY.nodes); expected.markers++; };
  end(state.trip.from.pt, "", state.trip.from.ad);
  end(state.trip.to.pt, "d", state.trip.to.ad);

  // 4) Mola noktası (filtreden bağımsız, pulse)
  if(act.mola_poi && POI_BY_ID[act.mola_poi]){
    const p = POI_BY_ID[act.mola_poi], k = KAT[p.kat];
    const glyph = p.kat==="lokanta"?"fork":p.kat==="spor"?"dumbbell":"museum";
    L.marker([p.lat,p.lon], {zIndexOffset:1000, keyboard:false, icon:L.divIcon({className:"", iconSize:[52,52], iconAnchor:[26,26], popupAnchor:[0,-22],
      html:`<div class="stopmk"><span class="pulse"></span><span class="pulse b"></span><span class="core" style="background:${k.renk}">${svg(glyph,17,2.3,"#fff")}</span><span class="lbl">Mola · ${act.mola} dk · +${act.puan}</span></div>`})})
      .bindPopup(poiPopup(p, true)).addTo(LY.stop);
    expected.markers++;
  }

  // 5) POI katmanları (klavye sırasına girmez; rotalara ulaşmayı engellemesin)
  D.pois.forEach(p => {
    if(!state.kat[p.kat] || p.id === act.mola_poi) return;
    L.marker([p.lat,p.lon], {icon:pinIcon(p), riseOnHover:true, title:p.isim, keyboard:false}).bindPopup(poiPopup(p, false)).addTo(LY.pois);
    expected.markers++;
  });

  // 6) Köprü trafik rozetleri
  if(state.kat.kopru){
    D.bridges.forEach(b => {
      const v = s.trafik[b.id], bc = v < 20 ? "#E30613" : v < 40 ? "#FBB034" : "#12A150";
      L.marker(b.pt, {keyboard:false, icon:L.divIcon({className:"", iconSize:[0,0], iconAnchor:[0,14],
        html:`<div class="bridge" style="--bc:${bc}"><i>${svg("road",11,2.4,"#fff")}</i>${b.id==="b1"?"1. Köprü":"2. Köprü"} · ${v} km/s</div>`})})
        .bindTooltip(`${esc(b.ad)} · simüle hız`, {className:"legtip", direction:"top", offset:[40,-14]}).addTo(LY.bridges);
      expected.markers++;
    });
  }

  // 7) Kriz katmanı
  if(s.kriz_aktif && state.kriz === "mac"){
    const st = D.meta.stadyum;
    L.marker(st.pt, {zIndexOffset:800, keyboard:false, icon:L.divIcon({className:"", iconSize:[52,52], iconAnchor:[26,26],
      html:`<div class="crowd"><span class="pulse"></span><span class="pulse b"></span><span class="core">${svg("stadium",14,2.3,"#fff")}</span><span class="lbl">Derbi yoğunluğu</span></div>`})})
      .bindTooltip(esc(st.ad), {className:"legtip", direction:"top"}).addTo(LY.kriz);
    expected.markers++;
  }
  if(s.kriz_aktif && state.kriz === "lodos"){
    // Etiket iptal olan vapur hattının ortasına (önerilen rotanın üstüne değil)
    const ferry = s.rotalar.find(r => r.id === "konforlu")?.legs.find(l => l.mod === "vapur");
    const g = ferry && D.geoms[ferry.g];
    const pt = g ? g[Math.floor(g.length/2)] : [41.0150, 29.0010];
    if(g) L.polyline(g, {color:"#E30613", weight:3, opacity:.55, dashArray:"4 8", interactive:false}).addTo(LY.kriz);
    L.marker(pt, {zIndexOffset:800, keyboard:false, icon:L.divIcon({className:"", iconSize:[0,0], iconAnchor:[0,0],
      html:`<div class="cancel">${svg("wind",14,2.4,"#fff")} Vapur seferleri iptal</div>`})}).addTo(LY.kriz);
    expected.markers++;
  }

  if(focus) fitRoute(routePts(act));
}

function padOpts(){
  const mob = innerWidth <= 820;
  const panel = document.querySelector(".panel").getBoundingClientRect();
  return mob
    ? {paddingTopLeft:[24, 120], paddingBottomRight:[24, innerHeight - panel.top + 80]}
    // sağ: zoom sütunu + bitiş/mola etiketleri; alt: mini oynatıcı
    : {paddingTopLeft:[panel.right + 32, 140], paddingBottomRight:[150, 100]};
}
let pendingFit = null;
function fitRoute(pts){
  if(!pts.length) return;
  // Gömülü görünümde (Streamlit bileşeni) iframe ilk anda 0 boyutlu olabilir: boyut gelince odaklan
  const sz = map.getSize();
  if(!sz.x || !sz.y){ pendingFit = pts; return; }
  pendingFit = null;
  map.flyToBounds(L.latLngBounds(pts), {...padOpts(), duration:.85, easeLinearity:.2, maxZoom:14.5});
}

/* ================= live simulation ================= */
const dist = (a,b) => { const dx=(b[1]-a[1])*Math.cos(a[0]*Math.PI/180), dy=b[0]-a[0]; return Math.hypot(dx,dy); };
const sim = {on:false, playing:false, t:0, total:0, segs:[], rid:null, legIdx:-1, raf:0, last:0,
             marker:null, trail:null, locked:false, fares:0, binisSay:0, done:false, lastPan:0, mpuan:false};

function buildSegs(r){
  let t = 0, lastPt = state.trip.from.pt;
  return r.legs.map((l, i) => {
    let pts = l.g && D.geoms[l.g] ? D.geoms[l.g] : null;
    if(!pts){ const p = l.mod === "mola" && POI_BY_ID[r.mola_poi]; pts = p ? [[p.lat,p.lon]] : [lastPt]; }
    const cum = [0]; for(let k = 1; k < pts.length; k++) cum.push(cum[k-1] + dist(pts[k-1], pts[k]));
    const seg = {i, l, t0:t, t1:t + l.dk, pts, cum, len:cum[cum.length-1]};
    t += l.dk; lastPt = pts[pts.length-1];
    return seg;
  });
}
function posAt(seg, f){
  if(seg.pts.length === 1 || seg.len === 0) return seg.pts[0];
  const d = f * seg.len; let k = 1;
  while(k < seg.cum.length - 1 && seg.cum[k] < d) k++;
  const a = seg.pts[k-1], b = seg.pts[k], span = seg.cum[k] - seg.cum[k-1] || 1, u = Math.min(1, (d - seg.cum[k-1]) / span);
  return [a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u];
}
// Bacak adından kısa hedef: "Marmaray · Söğütlüçeşme → Feneryolu" -> "Feneryolu"
const legTarget = l => { const m = /→\s*([^(]+)/.exec(l.ad || ""); return m ? m[1].trim() : ""; };
// "Kadıköy İskelesi" / "Kadıköy" -> "Kadıköy iskelesine"
const iskele = l => { const t = (legTarget(l) || "").replace(/\s*İskelesi$/i, ""); return t ? `${t} iskelesine` : "iskeleye"; };
const iskeleDe = l => { const t = (legTarget(l) || "").replace(/\s*İskelesi$/i, ""); return t ? `${t} iskelesinde` : "iskelede"; };
function vehIcon(mod, c){
  const ic = mod === "mola" ? "mola" : (ICO[mod] ? mod : "yurume");
  return L.divIcon({className:"", iconSize:[40,40], iconAnchor:[20,20],
    html:`<div class="veh ${mod==="mola"?"mola":""}" style="--vc:${mod==="mola"?"#FBB034":c}"><span class="ring2"></span><span class="core">${svg(ic,19,2.2,"#fff")}</span><span class="tag" id="vehTag"></span></div>`});
}
function simStart(){
  const r = aktifRota();
  if(r.iptal){ toast("Bu rota şu an kullanılamıyor."); return; }
  simStop(true);
  Object.assign(sim, {on:true, playing:true, t:0, rid:r.id, segs:buildSegs(r), legIdx:-1, locked:false, fares:0, binisSay:0, done:false, mpuan:false});
  sim.total = sim.segs.length ? sim.segs[sim.segs.length-1].t1 : 0;
  sim.trail = L.polyline([], {color: state.tema==="dark" ? "#EAF2FB" : "#0B2545", weight:4, opacity:.85, lineCap:"round", interactive:false}).addTo(SIMLY);
  sim.marker = L.marker(state.trip.from.pt, {zIndexOffset:2000, keyboard:false, interactive:false, icon:vehIcon("yurume", COL[r.renk])}).addTo(SIMLY);
  fitRoute(routePts(r));
  sim.last = performance.now();
  sim.raf = requestAnimationFrame(simFrame);
  renderPlayer(); renderCards(); renderPops();
}
function simStop(silent){
  cancelAnimationFrame(sim.raf);
  SIMLY.clearLayers();
  Object.assign(sim, {on:false, playing:false, t:0, legIdx:-1, marker:null, trail:null, locked:false, done:false});
  if(!silent){ renderPlayer(); renderCards(); renderPops(); }
}
function simToggle(){
  if(!sim.on || sim.done){ simStart(); return; }
  sim.playing = !sim.playing;
  if(sim.playing){ sim.last = performance.now(); sim.raf = requestAnimationFrame(simFrame); }
  else cancelAnimationFrame(sim.raf);
  renderPlayer();
}
function simFrame(ts){
  if(!sim.playing) return;
  const dt = Math.min(.1, (ts - sim.last) / 1000); sim.last = ts;
  const cur = sim.segs.find(s => sim.t < s.t1) || sim.segs[sim.segs.length-1];
  const rate = 2.4 * state.speed * (cur.l.mod === "mola" ? 4 : 1);   // sim-dakika / saniye
  sim.t = Math.min(sim.total, sim.t + dt * rate);
  simApply();
  if(sim.t >= sim.total){ simFinish(); return; }
  sim.raf = requestAnimationFrame(simFrame);
}
function simApply(){
  const seg = sim.segs.find(s => sim.t < s.t1) || sim.segs[sim.segs.length-1];
  if(seg.i !== sim.legIdx) onLegChange(seg);
  if(!sim.on) return;
  const f = seg.l.dk ? (sim.t - seg.t0) / seg.l.dk : 1;
  const pos = posAt(seg, Math.max(0, Math.min(1, f)));
  sim.marker.setLatLng(pos);
  const trail = [];
  for(const s of sim.segs){
    if(s.i < seg.i) trail.push(...s.pts);
    else if(s.i === seg.i){
      const d = f * s.len;
      for(let k = 0; k < s.pts.length && s.cum[k] <= d; k++) trail.push(s.pts[k]);
      trail.push(pos); break;
    }
  }
  sim.trail.setLatLngs(trail);
  const now = performance.now();
  if(now - sim.lastPan > 700){ sim.lastPan = now; if(!map.getBounds().pad(-.12).contains(pos)) map.panTo(pos, {animate:true, duration:.6}); }
  updatePlayerLive(seg);
}
function onLegChange(seg){
  const prev = sim.legIdx >= 0 ? sim.segs[sim.legIdx] : null;
  sim.legIdx = seg.i;
  const r = aktifRota(), m = seg.l.mod;
  sim.marker.setIcon(vehIcon(m, COL[r.renk]));
  if(prev && prev.l.mod === "mola" && !sim.mpuan){ sim.mpuan = true; awardPoints(r.puan); }
  // Ulaşım fiziği: açık denizde rota kilidi
  const wasLocked = sim.locked;
  sim.locked = m === "vapur";
  if(sim.locked && !wasLocked) toast(`${svg("lock",16,2.4,"var(--cyan-ink)")} Açık denizdesin · rota <b style="color:var(--cyan-ink)">${esc(iskele(seg.l))}</b> kadar kilitli`);
  if(!sim.locked && wasLocked) toast(`${svg("vapur",16,2.2,"var(--cyan-ink)")} ${esc(iskele(prev.l))} vardın · rota değişikliği serbest`);
  if(BINIS.has(m)){
    const ok = chargeFare(m);
    if(!ok){   // biniş noktasında bekle; devam edilince ücret yeniden denenir
      sim.playing = false; cancelAnimationFrame(sim.raf);
      sim.legIdx = seg.i - 1; sim.t = seg.t0;
    }
  }
  if(m === "mola") toast(`${svg("mola",16,2.2,"var(--yellow-ink)")} Mola başladı · ${esc(POI_BY_ID[r.mola_poi]?.isim || "")}`);
  renderCards(); renderPlayer();
}
function simFinish(){
  sim.playing = false; sim.done = true; cancelAnimationFrame(sim.raf);
  const r = aktifRota();
  if(r.mola && !sim.mpuan){ sim.mpuan = true; awardPoints(r.puan); }
  sim.locked = false;
  toast(`${svg("star",16,2.4,"var(--yellow)","var(--yellow)")} Varış ${fmt(toMin(state.saat) + sim.total)} · ${esc(state.trip.to.ad)} · Ücret ${tl(sim.fares)}`);
  renderPlayer(); renderCards(); renderPops();
}
function awardPoints(p){
  if(!p) return;
  state.puan += p;
  const w = $("wallet"); w.classList.remove("bump"); void w.offsetWidth; w.classList.add("bump");
  renderTop();
  toast(`${svg("star",16,2.4,"var(--yellow)","var(--yellow)")} <b>+${p} İBB Puanı</b> · Kapalı Çevrim: yalnızca ${KAPALI.join(", ")}'te geçerli`);
}

/* ================= wallet & family ================= */
function famLog(msg){
  const a = state.aile; a.log.unshift({t: sim.on ? fmt(toMin(state.saat) + sim.t) : state.saat, msg});
  a.log = a.log.slice(0, 8);
}
function fareFor(tip){
  const base = tip === "ogrenci" ? UCRET.ogrenci : UCRET.tam;
  return Math.round(base * (sim.binisSay > 0 ? UCRET.aktarma_orani : 1) * 100) / 100;
}
function autoTopUp(u){
  const a = state.aile;
  if(!u.oto || u.bakiye >= a.esik) return false;
  if(a.master.bakiye < a.yukleme){ famLog(`${u.ad}: ana kartta yetersiz bakiye, otomatik yükleme yapılamadı`); return false; }
  a.master.bakiye -= a.yukleme; u.bakiye += a.yukleme;
  famLog(`${u.ad}: bakiye ${tl(a.esik)} altına düştü → ana karttan ${tl(a.yukleme)} otomatik yüklendi`);
  toast(`${svg("family",16,2.2,"var(--green-ink)")} ${esc(u.ad)}'in kartına ana karttan <b style="color:var(--green-ink)">${tl(a.yukleme)}</b> otomatik yüklendi`);
  flashKid(u.id);
  return true;
}
function chargeFare(mod){
  const u = traveler();
  if(state.mod === "aile"){
    if(u){
      const f = fareFor(u.tip);
      if(u.bakiye < f) autoTopUp(u);
      if(u.bakiye < f){
        toast(`${svg("alert",16,2.2,"var(--red-ink)")} ${esc(u.ad)}: yetersiz bakiye (${tl(u.bakiye)}). Menüden otomatik yüklemeyi aç ve devam et.`);
        famLog(`${u.ad}: ${MOD_TR[mod]} binişi reddedildi (yetersiz bakiye)`);
        renderPops(); return false;
      }
      u.bakiye -= f; sim.fares += f; sim.binisSay++;
      famLog(`${u.ad}: ${MOD_TR[mod]} binişi −${tl(f)}`);
      autoTopUp(u);
    } else {
      const f = fareFor("tam"); state.aile.master.bakiye -= f; sim.fares += f; sim.binisSay++;
      famLog(`Ana kart: ${MOD_TR[mod]} binişi −${tl(f)}`);
    }
  } else {
    const f = fareFor("tam");
    if(state.bakiye < f){ toast(`${svg("alert",16,2.2,"var(--red-ink)")} Yetersiz bakiye · İstanbulkart'ını yükle`); return false; }
    state.bakiye -= f; sim.fares += f; sim.binisSay++;
  }
  renderTop(); renderPops();
  return true;
}
function flashKid(id){
  requestAnimationFrame(() => { const el = document.querySelector(`.kid[data-id="${id}"]`); if(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } });
}
function kidTrip(id){
  const u = state.aile.uyeler.find(x => x.id === id), f = UCRET.ogrenci;
  if(u.bakiye < f) autoTopUp(u);
  if(u.bakiye < f){ famLog(`${u.ad}: biniş reddedildi (yetersiz bakiye)`); toast(`${svg("alert",16,2.2,"var(--red-ink)")} ${esc(u.ad)}: yetersiz bakiye`); renderPops(); return; }
  u.bakiye -= f; famLog(`${u.ad}: metro binişi −${tl(f)}`);
  autoTopUp(u);
  renderPops(); renderTop();
}

// Kart içeriği: süre satırı + rota özeti + varış/gerekçe satırı (brief metinleri korunur)
function headline(r){

function setPop(name, {focus = true} = {}){
  const prev = state.pop;
  state.pop = (prev === name) ? null : name;
  ["time","wx","menu"].forEach(k => {
    const open = state.pop === k, el = $(k === "time" ? "popTime" : k === "wx" ? "popWx" : "popMenu");
    el.classList.toggle("open", open);
    $(POP_TRIGGER[k]).setAttribute("aria-expanded", open);
  });
  document.querySelectorAll(".score-pop").forEach(el => el.classList.remove("open"));
  document.querySelectorAll(".score-btn[aria-expanded]").forEach(el => el.setAttribute("aria-expanded","false"));
  if(state.pop && state.pop.startsWith("score:")){
    const id = state.pop.slice(6), btn = document.querySelector(`.score-btn[data-score="${id}"]`), sp = btn?.nextElementSibling;
    if(btn && sp){
      btn.setAttribute("aria-expanded","true"); sp.classList.add("open");
      const r = btn.getBoundingClientRect(), w = sp.offsetWidth, h = sp.offsetHeight;
      const left = Math.max(10, Math.min(innerWidth - w - 10, r.right - w));
      const top = r.bottom + 6 + h > innerHeight - 10 ? Math.max(10, r.top - h - 6) : r.bottom + 6;
      sp.style.left = left + "px"; sp.style.top = top + "px";
    }
  }
  // Odak yönetimi: balon açılınca içine, kapanınca tetikleyiciye
  const panel = state.pop && POP_TRIGGER[state.pop] ? $(state.pop === "time" ? "popTime" : state.pop === "wx" ? "popWx" : "popMenu") : null;
  if(panel && focus) requestAnimationFrame(() => panel.querySelector("button:not([disabled]),input:not([disabled])")?.focus());
  if(!state.pop && prev && POP_TRIGGER[prev] && focus) $(POP_TRIGGER[prev]).focus();
}

function updatePlayerLive(seg){

/* ================= actions ================= */
let lastFocusKey = null;
function render({pop=null, forceFocus=false, keepTime=false}={}){
  const r = aktifRota();
  const fk = r.id + "|" + (r.mola_poi || "");
  if(state.pop && state.pop.startsWith("score:")) state.pop = null;
  renderTrip(); renderTop(); renderCards(pop); renderPlayer(); renderPops({keepTime});
  const changed = forceFocus || fk !== lastFocusKey;
  renderMap(changed);
  lastFocusKey = fk;
  if(changed) requestAnimationFrame(() => document.querySelector(".rc.on")?.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"}));
  syncSheet();
  if(typeof pushRouteContext === "function") pushRouteContext();
}
function announce(msg){ const el = $("announce"); el.textContent = ""; requestAnimationFrame(() => el.textContent = msg); }
function shakeCard(id){
  const el = document.querySelector(`.rc[data-id="${id}"]`); if(!el) return;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
}
function selectRoute(id, {focusCard = false} = {}){
  const r = step().rotalar.find(x => x.id === id);
  if(!r) return;
  if(r.iptal){ shakeCard(id); toast(`${svg("wind",16,2.2,"var(--red-ink)")} ${esc(r.uyari || "Bu rota şu an kullanılamıyor")}`); return; }
  if(id === aktifRota().id){ fitRoute(routePts(r)); return; }
  if(sim.on && !sim.done && sim.locked){
    shakeCard(id);
    toast(`${svg("lock",16,2.4,"var(--cyan-ink)")} Açık denizde rota değişmez · ${esc(iskeleDe(sim.segs[sim.legIdx]?.l || {}))} değiştirebilirsin`);
    return;
  }
  const wasRunning = sim.on && !sim.done;
  if(sim.on) simStop(true);
  state.aktif = id;
  render({pop:id, forceFocus:true});
  announce(`${r.tip} seçildi, varış ${varis(r)}`);
  if(focusCard) document.querySelector(`.rc[data-id="${id}"]`)?.focus();
  if(wasRunning) toast(`Rota yeniden planlandı · ${esc(r.tip)}`);
}
function setSaat(h, opts = {}){
  if(sim.on && !sim.done) return;
  if(sim.on) simStop(true);
  state.saat = h; render(opts);
}
function setKriz(k){
  if(sim.on) simStop(true);
  state.kriz = k;
  render({forceFocus:true});
  const kk = D.meta.krizler[k];
  if(k !== "normal") toast(`${svg("alert",16,2.2, kk.seviye==="kritik"?"var(--red-ink)":"var(--yellow-ink)")} ${esc(kk.baslik)} (simülasyon)`);
  announce(`${kk.baslik}. Rotalar yeniden hesaplandı.`);
}
function toast(html){
  const t = $("toast"); t.innerHTML = `<span>${html}</span>`; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

function hemenCik(){
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  let s = Math.ceil(m / 30) * 30, msg = "";
  if(s < 360 || s > 1410){ s = s < 360 ? 360 : 1410; msg = " Simülasyon 06:00–23:30 arasını kapsar; en yakın saat seçildi."; }
  state.zamanMod = "kalkis";
  setSaat(fmt(s));
  toast(`${svg("clock",16,2.2,"var(--ink-2)")} Kalkış ${fmt(s)} olarak ayarlandı.${msg}`);
}

/* ---------- yolculuk arama: kalkış / varış ---------- */
let suggFor = null, suggItems = [], suggIdx = -1;
function openSugg(inp){
  suggFor = inp.id === "inFrom" ? "from" : "to";
  suggItems = searchItems(inp.value === state.trip[suggFor].ad ? "" : inp.value);
  suggIdx = suggItems.length ? 0 : -1;
  const box = $("sugg");
  box.innerHTML = suggItems.length ? suggItems.map((it, i) => {
    const col = it.kind === "ornek" ? "#0B2545" : it.kind === "iskele" ? "#00A3E0" : KAT[it.kind]?.renk || "#3E556F";
    const ic = it.kind === "iskele" ? "vapur" : KAT[it.kind] ? (it.kind==="lokanta"?"fork":it.kind==="spor"?"dumbbell":"museum") : it.kind === "ornek" ? "star" : "metro";
    return `<div class="sg" role="option" id="sg${i}" data-i="${i}" aria-selected="${i===suggIdx}"><i style="background:${col}">${svg(ic,14,2.2,"#fff")}</i><div><b>${esc(it.ad)}</b><span>${esc(it.alt)}</span></div></div>`;
  }).join("") : `<div class="sg-empty">Sonuç yok. Durak, iskele, Kent Lokantası, spor tesisi ya da müze adı dene.</div>`;
  const r = inp.getBoundingClientRect(), w = Math.min(360, innerWidth - 20);
  box.style.width = w + "px"; box.style.left = Math.max(10, Math.min(innerWidth - w - 10, r.left - 8)) + "px";
  box.classList.add("open");
  const h = box.offsetHeight;
  box.style.top = (r.bottom + 8 + h > innerHeight - 10 ? Math.max(10, r.top - h - 8) : r.bottom + 8) + "px";
  inp.setAttribute("aria-expanded", "true");
  inp.setAttribute("aria-activedescendant", suggIdx >= 0 ? "sg" + suggIdx : "");
}
function closeSugg(){
  $("sugg").classList.remove("open"); suggFor = null;
  ["inFrom","inTo"].forEach(id => { $(id).setAttribute("aria-expanded","false"); $(id).removeAttribute("aria-activedescendant"); });
}
function pickPlace(field, it){
  const other = state.trip[field === "from" ? "to" : "from"];
  if(hav(it.pt, other.pt) < 150){ toast(`${svg("alert",16,2.2,"var(--red-ink)")} Kalkış ve varış aynı nokta olamaz.`); renderTrip(); return; }
  state.trip[field] = {ad:it.ad, alt:it.alt, pt:it.pt, key:it.key};
  tripChanged(); closeSugg();
  if(state.zamanMod === "varis"){ const h = cikisBul(state.hedef); if(h) state.saat = h; }
  render({forceFocus:true});
  const st = step();
  announce(`${field === "from" ? "Kalkış" : "Varış"} ${it.ad}. ${st.rotalar.length} rota hesaplandı.`);
}
["inFrom","inTo"].forEach(id => {
  const inp = $(id);
  inp.addEventListener("focus", () => { inp.select(); openSugg(inp); });
  inp.addEventListener("input", () => openSugg(inp));
  inp.addEventListener("keydown", e => {
    if(!$("sugg").classList.contains("open")) { if(e.key === "ArrowDown") openSugg(inp); return; }
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault(); if(!suggItems.length) return;
      suggIdx = (suggIdx + (e.key === "ArrowDown" ? 1 : suggItems.length - 1)) % suggItems.length;
      document.querySelectorAll(".sg").forEach((el, i) => el.setAttribute("aria-selected", i === suggIdx));
      inp.setAttribute("aria-activedescendant", "sg" + suggIdx);
      $("sg" + suggIdx)?.scrollIntoView({block:"nearest"});
    } else if(e.key === "Enter"){ e.preventDefault(); if(suggIdx >= 0) pickPlace(suggFor, suggItems[suggIdx]); }
    else if(e.key === "Escape"){ e.stopPropagation(); closeSugg(); renderTrip(); }
  });
  inp.addEventListener("blur", () => setTimeout(() => { if(document.activeElement !== $("inFrom") && document.activeElement !== $("inTo")){ closeSugg(); renderTrip(); } }, 150));
});
$("sugg").addEventListener("mousedown", e => {
  const el = e.target.closest(".sg"); if(!el) return;
  e.preventDefault(); pickPlace(suggFor, suggItems[+el.dataset.i]);
});

$("btnGps").addEventListener("click", () => {

  b.setAttribute("aria-busy", "true");

    b.removeAttribute("aria-busy");
    const pt = [pos.coords.latitude, pos.coords.longitude];
    if(pt[0] < 40.75 || pt[0] > 41.35 || pt[1] < 28.0 || pt[1] > 29.95){
      toast(`${svg("alert",16,2.2,"var(--red-ink)")} Konumun İstanbul ağının dışında görünüyor. Kalkışı aramadan seç.`); return; }

  }, err => {
    b.removeAttribute("aria-busy");
    const msg = err.code === 1 ? "Konum izni verilmedi. Tarayıcı ayarlarından izin ver ya da kalkışı aramadan seç."
      : err.code === 3 ? "Konum zamanında alınamadı. Tekrar dene ya da kalkışı aramadan seç."
      : "Konum alınamadı (gömülü görünümde konum izni kapalı olabilir). Kalkışı aramadan seç.";
    toast(`${svg("alert",16,2.2,"var(--red-ink)")} ${msg}`);
  }, {timeout:8000, maximumAge:60000});

  if(g === "mod"){ if(v !== state.mod){ if(sim.on && !sim.done) simStop(true); state.mod = v; renderPops(); renderTop(); renderPlayer(); renderMap(false); $("popMenu").querySelector(`[data-g="mod"] [data-v="${v}"]`)?.focus(); } }
  else if(g === "tema"){ state.tema = v; document.documentElement.dataset.theme = v; store.set("ist-tema", v); setTiles(); renderMap(false); renderPops(); if(sim.trail) sim.trail.setStyle({color: v==="dark"?"#EAF2FB":"#0B2545"}); }
});
$("popMenu").addEventListener("change", e => {
  const s = e.target.closest("[data-hedef]"); if(!s) return;
  const u = state.aile.uyeler.find(x => x.id === s.dataset.hedef), d = DURAKLAR.find(x => x.ad === s.value);
  if(!u || !d) return;
  u.hedef = d; renderMap(false); renderPops();
  $("popMenu").querySelector(`[data-hedef="${u.id}"]`)?.focus();
  announce(`${u.ad} için hedef ${d.ad}`);
});
$("player").addEventListener("click", e => {
  if(e.target.closest("#btnPlay")){ simToggle(); $("btnPlay")?.focus(); }
  else if(e.target.closest("#btnReset")){ simStop(); toast("Simülasyon sıfırlandı"); }
  else if(e.target.closest("#btnSpeed")){ state.speed = SPEEDS[(SPEEDS.indexOf(state.speed)+1) % SPEEDS.length]; renderPlayer(); $("btnSpeed")?.focus(); }
});
$("layers").addEventListener("click", e => {
  const b = e.target.closest(".lc");
  if(b){ state.kat[b.dataset.k] = !state.kat[b.dataset.k]; renderLayers(); renderMap(false); document.querySelector(`.lc[data-k="${b.dataset.k}"]`)?.focus(); }
});
$("zoom").addEventListener("click", e => {
  const z = e.target.closest("[data-z]"); if(!z) return;
  if(z.dataset.z === "in") map.zoomIn(); else if(z.dataset.z === "out") map.zoomOut(); else fitRoute(routePts(aktifRota()));
});
document.addEventListener("click", e => { if(state.pop && !e.target.closest(".pop,.score-pop")) setPop(state.pop, {focus:false}); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && state.pop){ setPop(state.pop); }
  if(e.key === " " && e.target === document.body){ e.preventDefault(); simToggle(); }
});

/* ================= Streamlit köprüsü: aktif rota -> AI asistanı =================
   Streamlit bileşeni olarak çalışırken (app.py), aktif rotanın özetini Python'a gönderir;
   assistant_widget.render_assistant(route_context=...) bunu kullanır. Tek dosyalık demoda pasif. */
const ST_HOST = window.parent !== window;
const stPost = (type, extra) => { try{ window.parent.postMessage({isStreamlitMessage:true, type, ...extra}, "*"); }catch(e){} };
if(ST_HOST){
  stPost("streamlit:componentReady", {apiVersion:1});
  stPost("streamlit:setFrameHeight", {height:innerHeight});
}
const crowdLabel = k => k < .35 ? "Düşük" : k < .6 ? "Orta" : "Yüksek";
function routeContext(){
  const s = step(), r = aktifRota(); if(!r) return null;
  const rides = r.legs.filter(l => l._line || ["metro","marmaray","metrobus","vapur","tramvay","funikuler","teleferik","otobus"].includes(l.mod));
  const p = r.mola_poi && POI_BY_ID[r.mola_poi];
  const alts = s.rotalar.filter(x => x.id !== r.id).map(x =>
    `${x.tip} (${{kirmizi:"Kırmızı", mavi:"Mavi", sari:"Sarı"}[x.renk]}): ${x.sure} dk${x.mola ? ` + ${x.mola} dk mola` : ""}, ${x.ozet}${x.iptal ? " — kullanılamıyor" : ""}`);
  return {
    from: state.trip.from.ad, to: state.trip.to.ad,
    summary: r.legs.filter(l => l.mod !== "yurume").map(l => l.ad).join(" -> ") || r.ozet,
    duration_min: r.sure + r.mola,
    transfers: rides.slice(1).map(l => (l.ad.split(" · ")[1] || l.ad).split(" → ")[0]),
    crowd_level: `${crowdLabel(r.kalabalik * (s.trafik.cong ?? 0.5) + r.kalabalik * .3)} (${r.tip}, ${{kirmizi:"Kırmızı", mavi:"Mavi", sari:"Sarı"}[r.renk]} rota)`,
    alternatives: alts.join(" | "),
    rota_tipi: r.tip, kalkis_saati: state.saat, varis_saati: varis(r),
    mola_noktasi: p ? `${p.isim} (${KAT[p.kat].kisa}, ${r.mola} dk, +${r.puan} İBB Puanı)` : "yok",
    senaryo: D.meta.krizler[state.kriz].baslik,
    kopru_trafigi: `${s.trafik.durum}: 1. Köprü ${s.trafik.b1} km/s, 2. Köprü ${s.trafik.b2} km/s`,
    kullanim: state.mod === "aile" ? "Aile Modu" : "Bireysel"
  };
}
// Python'a giden tek değer: {route_context, ask, taha}. Python'dan gelen: {gemini, taha_var, replies}
const HOST = {gemini:false, taha_var:false, replies:{}};
const hostOut = {route_context:null, ask:null, taha:false};
let lastSent = null, ctxTimer = 0;
function sendHost(){
  if(!ST_HOST) return;
  const key = JSON.stringify(hostOut);
  if(key === lastSent) return;
  lastSent = key;
  stPost("streamlit:setComponentValue", {value:JSON.parse(key), dataType:"json"});
}
function pushRouteContext(){
  if(!ST_HOST) return;
  clearTimeout(ctxTimer);
  ctxTimer = setTimeout(() => { hostOut.route_context = routeContext(); sendHost(); }, 600);
}
addEventListener("message", e => {
  const d = e.data;
  if(!d || d.type !== "streamlit:render" || !d.args) return;
  const a = d.args;
  const wasG = HOST.gemini, wasT = HOST.taha_var;
  HOST.gemini = !!a.gemini; HOST.taha_var = !!a.taha_var; HOST.replies = a.replies || {};
  Object.entries(HOST.replies).forEach(([id, txt]) => aiApplyReply(id, txt));
  if(wasG !== HOST.gemini || wasT !== HOST.taha_var){ aiHeader(); if(state.pop === "menu") renderPops(); }
});

/* ================= İst-Route Asistanı: kural tabanlı beyin =================
   Yanıtlar yalnızca uygulamadaki veriden (GTFS rota motoru, POI, trafik, senaryo, cüzdan,
   PyTorch risk modeli) kurulur. Streamlit'te GOOGLE_API_KEY varsa Python, bu taslağı Gemini ile
   yeni bilgi eklemeden doğallaştırır; yoksa taslak olduğu gibi kalır. */
/*__ASSISTANT__*/
/* ---------- asistan arayüzü ---------- */
function aiHeader(){
  $("aiSub").textContent = HOST.gemini ? "Gerçek veriyle yanıtlar · Gemini ile doğallaştırılır" : "Uygulamadaki gerçek veriyle yanıt verir";
  const risk = riskOf(ai.profile);
  $("aiRisk").innerHTML = risk == null ? `<span>Risk modeli yüklenemedi.</span>`
    : `<span>Bakiye riski</span><span class="lv ${risk >= RM.threshold ? "hi" : "ok"}">%${Math.round(risk * 100)} · ${risk >= RM.threshold ? "yüksek" : "düşük"}</span><span>PyTorch</span>
       <button id="aiProfBtn" aria-expanded="${ai.profOpen}" aria-controls="aiProf">Profilim</button>`;
  if(RM){
    const p = ai.profile, opt = (f, v) => RM.classes[f].map(c => `<option ${c === v ? "selected" : ""}>${esc(c)}</option>`).join("");
    $("aiProf").innerHTML = `
      <label>Yaş grubu<select data-pf="yas_grubu">${opt("yas_grubu", p.yas_grubu)}</select></label>
      <label>Ortalama harcama (₺)<input data-pf="h_ort_harcama" type="number" min="0" step="10" value="${p.h_ort_harcama}"></label>
      <label>Aylık aktif gün<input data-pf="h_aktif_gun" type="number" min="0" max="31" value="${p.h_aktif_gun}"></label>
      <label>En sık harcama<select data-pf="h_en_sik_mcc">${opt("h_en_sik_mcc", p.h_en_sik_mcc)}</select></label>
      <label>Mobil giriş sayısı<input data-pf="m_giris_sayisi" type="number" min="0" value="${p.m_giris_sayisi}"></label>
      <p>Model: doğruluk %${Math.round(RM.metrics.accuracy * 100)}, ROC-AUC ${RM.metrics.roc_auc.toFixed(2)} (${RM.metrics.n_rows.toLocaleString("tr-TR")} yolcu).</p>`;
    $("aiProf").classList.toggle("open", ai.profOpen);
  }
}
function aiRender(){
  $("aiLog").innerHTML = ai.msgs.map(m => `<div class="msg ${m.role}" data-mid="${m.id}">${m.typing ? `<span class="typing"><i></i><i></i><i></i></span>` : md(m.text)}`
    + (m.role === "bot" && m.tag ? `<div class="tag ${m.gemini ? "g" : ""}">${m.tag}</div>` : "")
    + (m.act ? `<button class="act" data-act="${m.id}">${esc(m.act.lbl)}</button>` : "") + `</div>`).join("");
  $("aiLog").scrollTop = $("aiLog").scrollHeight;
}
function aiAsk(q){
  q = String(q || "").trim(); if(!q) return;
  ai.msgs.push({id:"m" + (++ai.seq), role:"me", text:q});
  let res;
  try{ res = aiAnswer(q); }catch(err){ console.error(err); res = {text:"Bu soruyu yanıtlarken bir sorun oluştu. Farklı bir şekilde sorar mısın?"}; }
  const id = "a" + (++ai.seq);
  const m = {id, role:"bot", text:res.text, tag:"Veriden · anahtarsız", act:res.act || (res.route && res.route.id !== aktifRota().id ? {lbl:`Haritada göster: ${res.route.tip}`, fn:() => selectRoute(res.route.id)} : null)};
  ai.msgs.push(m);
  if(ST_HOST && HOST.gemini){
    m.tag = "Veriden · Gemini ile doğallaştırılıyor…";
    hostOut.ask = {id, q, draft:res.text}; sendHost();
    setTimeout(() => { if(m.tag.endsWith("…")){ m.tag = "Veriden · Gemini yanıt vermedi"; aiRender(); } }, 45000);
  }
  aiRender();
}
function aiApplyReply(id, txt){
  const m = ai.msgs.find(x => x.id === id);
  if(!m || m.gemini) return;
  if(txt && txt.trim()){ m.text = txt.trim(); m.gemini = true; m.tag = "Veriden · Gemini ile doğallaştırıldı"; }
  else m.tag = "Veriden · Gemini kullanılamadı (kota/bağlantı)";
  aiRender();
}
function aiToggle(open = !ai.open){
  ai.open = open;
  $("aiPanel").classList.toggle("open", open);
  $("aiFab").setAttribute("aria-expanded", open);
  if(open){
    if(!ai.msgs.length){
      ai.msgs.push({id:"a0", role:"bot", text:`Merhaba! Rotanı, trafiği, molaları ve bakiyeni uygulamadaki gerçek veriyle yanıtlarım. Seçili yolculuk: **${state.trip.from.ad} → ${state.trip.to.ad}**, ${state.saat}.`, tag:"İst-Route Asistanı"});
    }
    aiHeader(); aiRender(); setTimeout(() => $("aiIn").focus(), 50);
  } else $("aiFab").focus();
}
const AI_CHIPS = ["Nasıl giderim?", "Trafiğe girmeden nasıl giderim?", "Yolda mola verip puan kazanabilir miyim?", "Bakiyem yeter mi?", "Bugün bir uyarı var mı?", "Çocuklarım nerede?"];
$("aiChips").innerHTML = AI_CHIPS.map(c => `<button type="button" data-q="${esc(c)}">${esc(c)}</button>`).join("");
$("aiFab").addEventListener("click", e => { e.stopPropagation(); aiToggle(); });
$("aiClose").addEventListener("click", () => aiToggle(false));
$("aiChips").addEventListener("click", e => { const b = e.target.closest("[data-q]"); if(b) aiAsk(b.dataset.q); });
$("aiForm").addEventListener("submit", e => { e.preventDefault(); const v = $("aiIn").value; $("aiIn").value = ""; aiAsk(v); });
$("aiPanel").addEventListener("click", e => {
  e.stopPropagation();
  if(e.target.closest("#aiProfBtn")){ ai.profOpen = !ai.profOpen; aiHeader(); return; }
  const a = e.target.closest("[data-act]");
  if(a){ const m = ai.msgs.find(x => x.id === a.dataset.act); if(m && m.act){ m.act.fn(); m.act = null; aiRender(); } }
});
$("aiPanel").addEventListener("change", e => {
  const f = e.target.dataset.pf; if(!f || !ai.profile) return;
  ai.profile[f] = e.target.type === "number" ? Math.max(0, +e.target.value || 0) : e.target.value;
  const keep = e.target.dataset.pf; aiHeader(); $("aiProf").querySelector(`[data-pf="${keep}"]`)?.focus();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && ai.open && !state.pop) aiToggle(false); });

/* ================= debug / doğrulama ================= */
window.__istRoute = {
  state, sim, D,
  audit(){
    const dom = document.querySelectorAll(".leaflet-marker-pane > *").length;
    const simM = SIMLY.getLayers().filter(l => l instanceof L.Marker).length;
    return {ok: dom === expected.markers + simM, domMarkers: dom, expectedMarkers: expected.markers + simM,
            polylines: document.querySelectorAll(".leaflet-overlay-pane path").length};
  }
};

Object.assign(hooks, {
  onTripChanged(){ if(sim.on) simStop(true); },
  render, setSaat, hemenCik,
  setAile(){ state.mod = "aile"; renderPops(); renderTop(); renderPlayer(); renderMap(false); }
});

/* ================= boot ================= */
document.documentElement.dataset.theme = state.tema;
$("btnGps").innerHTML = svg("target",17,2.2);
$("aiFab").querySelector(".ai-ic").innerHTML = svg("spark",20,2.2,"#fff");
$("aiClose").innerHTML = svg("minus",17,2.4);
$("aiSend").innerHTML = svg("play",15,2.4,"currentColor","currentColor");
$("btnSwap").innerHTML = svg("swap",17,2.2);
setTiles(); renderLayers();
render({forceFocus:true});
new ResizeObserver(() => {
  const sz = $("map").getBoundingClientRect();
  if(sz.width && sz.height){ map.invalidateSize(false); if(pendingFit) fitRoute(pendingFit); }
}).observe($("map"));
addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { syncSheet(); fitRoute(routePts(aktifRota())); }, 200); });
})();
</script>
</body>
</html>
